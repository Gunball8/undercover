<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="description" content="Undercover & Mr White : le jeu d'imposteurs à jouer entre amis sur un seul téléphone." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Undercover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preload" href="fonts/jersey-10-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <title>Undercover · Mr White</title>
  <style>
    /* Polices embarquées (SIL Open Font License, voir fonts/) : pas de dépendance réseau */
    @font-face { font-family:"Press Start 2P"; src:url("fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); font-weight:400; font-display:swap; }
    @font-face { font-family:"Jersey 10"; src:url("fonts/jersey-10-latin-400-normal.woff2") format("woff2"); font-weight:400; font-display:swap; }
    @font-face { font-family:"Inter"; src:url("fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight:100 900; font-style:normal; font-display:swap; }

    :root {
      color-scheme: dark;
      --bg:#0a0a0c; --bg-2:#0e0e12;
      --s1:#121217; --s2:#18181f; --s3:#23232c;
      --line:#1c1c24; --line-2:#2a2a35; --line-3:#3a3a48;
      --ink:#f4f4f6; --ink-2:#d8d8e0; --mut:#9a9aab; --dim:#5f5f70;
      --yellow:#ffd23f; --yellow-d:#b38f0c; --yellow-ink:#1a1405;
      --pink:#ff4f8b; --pink-d:#a8285a;
      --cyan:#35e0ff; --cyan-d:#168ea8;
      --green:#6dff9c; --red:#ff5a5a;
      --cit:var(--cyan); --und:var(--pink); --mrw:#f4f4f6;
      /* Press Start 2P tasse les majuscules accentuées (É y ressemble à é) : que des textes sans accents. */
      --pixel:"Press Start 2P",ui-monospace,Menlo,monospace;
      --arcade:"Jersey 10","Arial Narrow",system-ui,sans-serif;
      --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --press:0 4px 0 #040406;
      --st:env(safe-area-inset-top,0px);
      --sb:env(safe-area-inset-bottom,0px);
      --dock-h:120px;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { height:100%; }
    body {
      margin:0; min-height:100%; background:var(--bg); color:var(--ink);
      font:400 15px/1.5 var(--sans);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      overscroll-behavior-y:none; /* pas de pull-to-refresh accidentel en pleine partie */
    }
    /* Écran d'arcade : lueur en haut, grille de points, lignes de balayage */
    body::before {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(700px 380px at 50% -8%, rgba(255,210,63,.07), transparent 70%),
        radial-gradient(600px 420px at 110% 105%, rgba(255,79,139,.06), transparent 65%),
        radial-gradient(600px 420px at -10% 100%, rgba(53,224,255,.05), transparent 65%),
        radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.4px) 0 0/18px 18px;
    }
    body::after {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px);
    }
    body.locked { overflow:hidden; }
    #app { max-width:560px; margin:0 auto; padding:calc(8px + var(--st)) 16px calc(var(--dock-h) + 24px); }
    button { font:inherit; color:inherit; border:0; background:none; padding:0; margin:0; cursor:pointer; touch-action:manipulation; }
    input { font:inherit; }
    :focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
    .hidden { display:none !important; }
    .center { text-align:center; }
    .note { margin:12px 0 0; font-size:13px; line-height:1.5; color:var(--mut); }
    .note.top { margin:0 0 14px; }
    /* Petites étiquettes façon écran de jeu */
    .hud { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font:400 10px/1.6 var(--pixel); text-transform:uppercase; color:var(--mut); }
    .hud.y { color:var(--yellow); } .hud.c { color:var(--cyan); } .hud.p { color:var(--pink); }
    .kicker { display:flex; align-items:center; flex-wrap:wrap; gap:7px; font:400 19px/1.1 var(--arcade); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
    .kicker .sep { color:var(--dim); }
    .blink { animation:blink 1s steps(2, start) infinite; }

    /* Pixel art (icônes, rôles, monstres des joueurs) */
    .px { display:block; flex:none; width:18px; height:18px; }
    .px.sm { width:14px; height:14px; }
    .px.xs { width:11px; height:11px; }
    .sp { display:block; flex:none; width:18px; height:18px; }
    .sp.cit { color:var(--cit); } .sp.und { color:var(--und); } .sp.mrw { color:var(--mrw); }
    .sp.xs { width:13px; height:13px; }
    .sp.md { width:26px; height:26px; }
    .sp.lg { width:52px; height:52px; }
    .sp.xl { width:76px; height:76px; }

    /* ---------- Boutons d'arcade ---------- */
    .btn {
      display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
      min-height:56px; padding:6px 18px 8px; border-radius:10px;
      background:var(--yellow); color:var(--yellow-ink); box-shadow:0 5px 0 var(--yellow-d);
      font:400 27px/1 var(--arcade); letter-spacing:.05em; text-transform:uppercase; text-align:center;
      transition:transform .06s, box-shadow .06s, filter .15s;
    }
    .btn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--yellow-d); }
    .btn:disabled { filter:grayscale(1) brightness(.45); cursor:default; }
    .btn .px { width:16px; height:16px; }
    .btn.accent { box-shadow:0 5px 0 var(--yellow-d), 0 0 34px -8px rgba(255,210,63,.55); }
    .btn.pink { background:var(--pink); color:#fff; box-shadow:0 5px 0 var(--pink-d); }
    .btn.pink:active:not(:disabled) { box-shadow:0 1px 0 var(--pink-d); }
    .btn.cyan { background:var(--cyan); color:#03171c; box-shadow:0 5px 0 var(--cyan-d); }
    .btn.cyan:active:not(:disabled) { box-shadow:0 1px 0 var(--cyan-d); }
    .btn.ghost { background:var(--s2); color:var(--ink); border:2px solid var(--line-3); box-shadow:var(--press); }
    .btn.ghost:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 #040406; }
    .btn.ghost:disabled { filter:none; opacity:.35; }
    .btn.sm { min-height:44px; padding:4px 14px 6px; border-radius:9px; font-size:22px; }
    .btn.big { min-height:62px; font-size:31px; }
    .iconbtn {
      width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:10px;
      background:var(--s2); border:2px solid var(--line-3); color:var(--ink-2); box-shadow:var(--press);
    }
    .iconbtn:active { transform:translateY(3px); box-shadow:0 1px 0 #040406; }
    .link { display:block; margin:10px auto 0; padding:10px; color:var(--mut); font-size:13px; font-weight:500; text-decoration:underline; text-decoration-color:var(--line-3); text-underline-offset:4px; }
    .mini {
      display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 12px 2px; border-radius:9px;
      background:var(--s2); border:2px solid var(--line-3); color:var(--ink-2); box-shadow:0 3px 0 #040406;
      font:400 19px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase;
    }
    .mini:active { transform:translateY(2px); box-shadow:0 1px 0 #040406; }

    /* ---------- Accueil ---------- */
    .hero { display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px 12px; padding:22px 0 18px; }
    .logo {
      grid-column:1 / -1; margin:0; font:400 clamp(21px, 7.3vw, 32px)/1.15 var(--pixel); color:var(--yellow);
      text-shadow:3px 3px 0 var(--pink), 0 0 24px rgba(255,210,63,.35);
    }
    .tagline { margin:0; color:var(--cyan); }
    .hero-actions { display:flex; gap:8px; }
    .resume {
      display:grid; gap:14px; margin:0 0 4px; padding:16px; border-radius:14px;
      background:var(--s1); border:2px solid var(--yellow); box-shadow:0 5px 0 var(--yellow-d);
      animation:pop .3s steps(4) both;
    }
    .resume .title { margin-top:8px; font:400 30px/1 var(--arcade); letter-spacing:.03em; text-transform:uppercase; }
    .sec { margin-top:14px; padding:16px; border-radius:14px; background:var(--s1); border:2px solid var(--line-2); box-shadow:var(--press); }
    .sec-h { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .sec-h h2 { margin:0; font:400 32px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; }
    .count { font:400 10px/1.4 var(--pixel); color:var(--mut); text-transform:uppercase; }

    /* Joueurs */
    .plist { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
    .prow { min-width:0; display:flex; align-items:center; gap:10px; padding:5px; border-radius:12px; background:var(--bg-2); border:2px solid var(--line-2); animation:pop .2s steps(3) both; }
    .prow:focus-within { border-color:var(--yellow); }
    .prow.dup { border-color:var(--red); }
    .avbtn { border-radius:10px; }
    .avbtn:active { transform:scale(.9); }
    .pname { flex:1; width:0; min-width:0; padding:8px 2px 10px; background:transparent; border:0; outline:none; color:var(--ink); font:400 26px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; }
    .x { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:9px; color:var(--dim); }
    .x:hover, .x:active { color:var(--red); background:rgba(255,90,90,.1); }
    .padd { display:flex; gap:10px; margin-top:12px; }
    .padd input {
      flex:1; min-width:0; height:48px; padding:2px 14px 4px; border-radius:10px; outline:none;
      border:2px dashed var(--line-3); background:var(--bg-2); color:var(--ink);
      font:400 24px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase;
    }
    .padd input::placeholder { color:var(--dim); text-transform:none; letter-spacing:.02em; }
    .padd input:focus { border-style:solid; border-color:var(--yellow); }
    .padd .btn { width:auto; flex:none; min-height:48px; }
    .empty { padding:16px 12px; border:2px dashed var(--line-3); border-radius:12px; color:var(--mut); font-size:14px; text-align:center; }

    /* Avatars : un petit monstre pixel par joueur */
    .av {
      display:inline-grid; place-items:center; flex:none; border-radius:10px;
      background:hsl(var(--h,260) 45% 11%); border:2px solid hsl(var(--h,260) 60% 33%); color:hsl(var(--h,260) 95% 64%);
    }
    .av .inv { width:64%; height:64%; }
    .av-sm { width:30px; height:30px; border-radius:7px; border-width:1.5px; }
    .av-md { width:42px; height:42px; }
    .av-lg { width:58px; height:58px; border-radius:12px; }
    .av-xl { width:96px; height:96px; border-radius:18px; border-width:3px; }

    /* Rôles */
    .comp { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; min-height:62px; padding:16px; margin-bottom:6px; border-radius:12px; background:#07070a; border:2px solid var(--line-2); }
    .comp .sp { width:24px; height:24px; animation:hop .6s steps(2) infinite alternate; }
    .comp .sp:nth-child(even) { animation-delay:.3s; }
    .comp .note { margin:0; }
    .rrow { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:2px dashed var(--line-2); }
    .rtxt { flex:1; min-width:0; }
    .rtxt b { display:block; font:400 26px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; }
    .rtxt small { display:block; margin-top:3px; color:var(--mut); font-size:13px; }
    .rrow.cit b { color:var(--cit); } .rrow.und b { color:var(--und); } .rrow.mrw b { color:var(--mrw); }
    .stepper { display:flex; align-items:center; gap:6px; flex:none; }
    .stepper button { width:40px; height:40px; display:grid; place-items:center; border-radius:9px; background:var(--s3); border:2px solid var(--line-3); color:var(--ink); box-shadow:0 3px 0 #040406; }
    .stepper button:active { transform:translateY(2px); box-shadow:0 1px 0 #040406; }
    .stepper button[aria-disabled="true"] { background:var(--s2); color:var(--dim); }
    .stepper output { min-width:30px; text-align:center; font:400 34px/1 var(--arcade); }
    .cnum { width:122px; flex:none; text-align:center; font:400 34px/1 var(--arcade); color:var(--cit); }

    /* Thèmes */
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip {
      display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 12px 2px; border-radius:9px;
      background:var(--bg-2); border:2px solid var(--line-2); color:var(--mut);
      font:400 21px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase;
    }
    .chip:active { transform:scale(.95); }
    .chip .n { font:400 8px/1 var(--pixel); opacity:.75; }
    .chip.on { background:rgba(255,210,63,.08); border-color:var(--yellow); color:var(--yellow); }
    .row-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }

    /* Options */
    .opt + .opt { margin-top:16px; }
    .opt-l { margin-bottom:8px; font:400 22px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); }
    .seg { display:flex; gap:4px; padding:4px; border-radius:12px; background:var(--bg-2); border:2px solid var(--line-2); overflow-x:auto; scrollbar-width:none; }
    .seg::-webkit-scrollbar { display:none; }
    .seg button { flex:1 0 auto; height:38px; padding:0 10px 2px; border-radius:8px; color:var(--mut); font:400 21px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
    .seg button.on { background:var(--cyan); color:#03171c; box-shadow:0 3px 0 var(--cyan-d); }
    .switch-row { display:flex; align-items:center; gap:14px; margin-top:14px; padding-top:14px; border-top:2px dashed var(--line-2); cursor:pointer; }
    .sw-txt { flex:1; }
    .sw-txt b { display:block; font:400 23px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; }
    .sw-txt small { display:block; margin-top:4px; color:var(--mut); font-size:13px; line-height:1.45; }
    .sw {
      appearance:none; -webkit-appearance:none; position:relative; flex:none; margin:0; cursor:pointer;
      width:52px; height:30px; border-radius:8px; background:var(--s3); border:2px solid var(--line-3);
    }
    .sw::before { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:4px; background:var(--mut); transition:transform .12s steps(3); }
    .sw:checked { background:#0f2a1a; border-color:var(--green); }
    .sw:checked::before { transform:translateX(22px); background:var(--green); }
    .foot { margin:18px 0 0; color:var(--dim); font-size:13px; line-height:1.5; text-align:center; }

    /* ---------- Dock (actions en bas) ---------- */
    .dock {
      position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none;
      padding:28px 16px calc(14px + var(--sb));
      background:linear-gradient(to top, var(--bg) 62%, rgba(10,10,12,0));
    }
    .dock-in { max-width:528px; margin:0 auto; display:grid; gap:12px; pointer-events:auto; }
    .dock-msg { text-align:center; font:400 20px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; color:var(--yellow); }
    .dock-row { display:grid; grid-template-columns:auto 1fr; gap:10px; }
    .dock-row > .btn.ghost:first-child { width:56px; padding:0; }
    .two { display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:10px; }

    /* ---------- En jeu ---------- */
    .topbar { display:flex; align-items:flex-start; gap:12px; padding:14px 0 16px; }
    .tb-txt { flex:1; min-width:0; }
    .tb-title { margin:6px 0 0; font:400 50px/.95 var(--arcade); letter-spacing:.04em; text-transform:uppercase; text-shadow:0 0 22px rgba(255,255,255,.12); }
    .ci { display:inline-flex; align-items:center; gap:10px; }
    .ci > span { display:inline-flex; align-items:center; gap:4px; }
    .phases { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
    .phases span { padding:3px 10px 5px; border-radius:8px; border:2px solid var(--line-2); color:var(--dim); font:400 19px/1 var(--arcade); letter-spacing:.05em; text-transform:uppercase; }
    .phases span.on { background:var(--yellow); border-color:var(--yellow); color:var(--yellow-ink); }
    .phases span.done { color:var(--mut); border-color:var(--line-3); }
    .lead { margin:0 0 16px; font-size:15px; line-height:1.55; color:var(--mut); }
    .lead b { color:var(--ink); font-weight:600; }

    .pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
    .pcard {
      position:relative; display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
      padding:16px 8px 14px; border-radius:14px; background:var(--s1); border:2px solid var(--line-2); box-shadow:var(--press);
      transition:border-color .15s, background .15s, opacity .2s;
    }
    .pcard:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 #040406; }
    .pcard .nm { font:400 26px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; overflow-wrap:anywhere; }
    .pcard .st { display:inline-flex; align-items:center; gap:6px; font:400 9px/1 var(--pixel); text-transform:uppercase; color:var(--dim); }
    .pcard.done { opacity:.4; box-shadow:none; }
    .pcard.done .st { color:var(--green); }
    .pcard.next { border-color:var(--yellow); }
    .pcard.next .st { color:var(--yellow); animation:blink 1s steps(2, start) infinite; }
    .pcard.sel { border-color:var(--pink); background:#1c0c14; box-shadow:0 4px 0 var(--pink-d); }
    .pcard .mark { position:absolute; top:8px; right:8px; width:22px; height:22px; display:grid; place-items:center; border-radius:6px; background:var(--pink); color:#fff; }
    .pcard.spin { border-color:var(--yellow); background:#241e06; box-shadow:0 4px 0 var(--yellow-d); }
    .pcard:disabled { cursor:default; }
    .pgrid.dense { grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:8px; }
    .pgrid.dense .pcard { padding:12px 6px 10px; gap:7px; }
    .pgrid.dense .av-lg { width:46px; height:46px; }
    .pgrid.dense .nm { font-size:22px; }

    /* Indices */
    .spot {
      display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;
      padding:22px 16px 22px; border-radius:16px; background:var(--s1);
      border:2px solid var(--yellow); box-shadow:0 5px 0 var(--yellow-d), 0 0 50px -16px rgba(255,210,63,.45);
      animation:pop .28s steps(4) both;
    }
    .spot .who { font:400 clamp(46px, 14vw, 66px)/.92 var(--arcade); letter-spacing:.03em; text-transform:uppercase; overflow-wrap:anywhere; text-shadow:0 0 22px rgba(255,255,255,.15); }
    .spot .rule { font-size:14px; color:var(--mut); }
    .order { list-style:none; margin:16px 0 0; padding:0; display:grid; gap:6px; }
    .order li { display:flex; align-items:center; gap:10px; padding:6px 10px; border-radius:10px; background:var(--bg-2); border:2px solid transparent; color:var(--mut); font:400 23px/1 var(--arcade); letter-spacing:.04em; text-transform:uppercase; }
    .order li .n { width:26px; font:400 10px/1 var(--pixel); color:var(--dim); }
    .order li .ok { margin-left:auto; color:var(--green); }
    .order li.cur { color:var(--ink); border-color:var(--yellow); background:#1d1905; }
    .order li.cur .n { color:var(--yellow); }
    .order li.done { color:var(--dim); }
    .tip { margin-top:16px; padding:12px 14px; border-radius:12px; border:2px dashed var(--line-3); color:var(--mut); font-size:14px; line-height:1.5; display:flex; gap:10px; align-items:flex-start; }
    .tip .px { color:var(--pink); margin-top:2px; }

    /* Débat : compteur géant + barre d'énergie */
    .ring { margin:6px 0 20px; text-align:center; }
    .ring .num { display:grid; justify-items:center; gap:8px; }
    .ring .num span { font:400 clamp(120px, 40vw, 176px)/.8 var(--arcade); font-variant-numeric:tabular-nums; text-shadow:0 0 34px rgba(255,255,255,.16); }
    .ring .num small { font:400 10px/1 var(--pixel); text-transform:uppercase; color:var(--mut); }
    .bar { display:grid; grid-template-columns:repeat(20, 1fr); gap:4px; margin-top:22px; }
    .bar i { height:18px; border-radius:3px; background:var(--s3); }
    .bar i.on { background:var(--cyan); box-shadow:0 0 10px -2px var(--cyan); }
    .ring.warn .num span { color:var(--yellow); }
    .ring.warn .bar i.on { background:var(--yellow); box-shadow:0 0 10px -2px var(--yellow); }
    .ring.danger .num span { color:var(--red); animation:blink .6s steps(2, start) infinite; }

    if (invaderCache.has(seed)) return invaderCache.get(seed);
    let s = seed >>> 0 || 1;
    const rnd = () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const g = Array.from({ length: 7 }, () => Array(7).fill(0));
    const set = (r, c, v) => { g[r][c] = v; g[r][6 - c] = v; };
    for (let r = 0; r < 7; r++) for (let c = 0; c < 4; c++) set(r, c, rnd() < 0.5 ? 1 : 0);
    for (let c = 2; c < 4; c++) set(1, c, 1);           // haut de la tête
    set(2, 1, 1); set(2, 2, 0); set(2, 3, 1);           // les yeux
    for (let c = 1; c < 4; c++) set(3, c, 1);           // le corps
    const rows = g.map((row) => row.map((v) => (v ? "X" : ".")).join(""));
    invaderCache.set(seed, rows);
    return rows;

    for (const cat of selectedCats()) for (const pair of b[cat]) all.push({ cat, pair, key: `${pair[0]}|${pair[1]}` });

    if (!cand.length) { all.forEach((x) => used.delete(x.key)); cand = all; }
    const ch = cand[Math.floor(Math.random() * cand.length)];
    used.add(ch.key);
    store.set(K.used, [...used].slice(-800));
    // 50/50 : sinon les habitués savent que « gauche = Citizens »

    return { citizen: ch.pair[swap ? 1 : 0], undercover: ch.pair[swap ? 0 : 1], cat: ch.cat };

    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);

    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

  function openCustom() {
    const list = h("div", { class: "cp-list" });

    const draw = () => {
      list.replaceChildren(...(prefs.custom.length
        ? prefs.custom.map((pr, i) => h("div", { class: "cp-row" },
            h("span", null, pr[0]), h("span", { class: "vs" }, "VS"), h("span", null, pr[1]),
            h("button", { class: "x", type: "button", "aria-label": `Supprimer ${pr[0]} / ${pr[1]}`, onclick: () => {

            } }, icon("close", "px sm"))))
        : [h("div", { class: "empty" }, "Aucune paire perso pour l'instant.")]));

      e.preventDefault();
      const x = a.value.trim(), y = b.value.trim();
      if (!x || !y) { deny("Il faut deux mots", x ? b : a); (x ? b : a).focus(); return; }
      if (sameWord(x, y)) { deny("Les deux mots doivent être différents", b); return; }
      if (prefs.custom.some(([p, q]) => (sameWord(p, x) && sameWord(q, y)) || (sameWord(p, y) && sameWord(q, x)))) { deny("Cette paire existe déjà", a); return; }
      prefs.custom.push([x, y]);
      savePrefs(); play("tap");
      a.value = ""; b.value = ""; a.focus();
      draw();
      if (lobby) { renderChips(); refreshDock(); }
    };
    sheet("Mes paires", h("div", null,
      h("p", { class: "note top" },

  // ============================================================
  // LANCEMENT / REPRISE / ABANDON
  // ============================================================
  function startGame() {
    const issue = lobbyIssue();
    if (issue) { toast(issue); return; }
    unlockAudio();
    const { c, u, w } = comp();
    const roles = shuffle([...rep(c, "CITIZEN"), ...rep(u, "UNDERCOVER"), ...rep(w, "MRWHITE")]);
    game = {
      v: 2,
      players: prefs.players.map((p) => ({ name: p.name.trim(), emoji: p.emoji, hue: p.hue, seed: p.seed })),
      roles,
      alive: roles.map(() => true),
      seen: roles.map(() => false),
      words: pickWords(),
      cfg: { timer: prefs.timer, clueWords: prefs.clueWords, hideRoles: prefs.hideRoles },
      comp: { c, u, w },
      round: 1, order: [], speaker: 0,
      remaining: 0, total: 0, paused: false,
      elim: null, log: [], outcome: null, scored: false, points: null,
      phase: "reveal",
    };
    lobby = null;
    keepAwake(); armBack(); play("start");
    go("reveal");
  }
  function resumeGame(saved) {
    game = saved;
    lobby = null;
    if (game.phase === "debate") game.paused = true;
    keepAwake(); armBack();
    render(true);
    toast("Partie reprise");
  }
  function quitGame() {
    stopTimer(); releaseWake(); closeAllModals();
    store.del(K.game);
    game = null;
    render(true);
  }

  // ---------- En-tête commun en jeu ----------
  function topbar(title, kicker) {
    if (kicker == null) {

    [["CITIZEN", c], ["UNDERCOVER", u], ["MRWHITE", w]].map(([r, k]) => h("span", null, sprite(r, "xs"), k)));

  // ============================================================
  // 1) DISTRIBUTION DES MOTS
  // ============================================================
  function renderReveal() {

      h("div", { class: `pgrid${n > 8 ? " dense" : ""}` }, game.players.map((p, i) => h("button", {
        class: `pcard${game.seen[i] ? " done" : ""}${i === next ? " next" : ""}`, type: "button",
        "aria-label": game.seen[i] ? `${p.name}, mot déjà vu` : `${p.name}, voir mon mot`,
        onclick: () => tapReveal(i),
      }, avatar(p, "lg"), h("span", { class: "nm" }, p.name),
        h("span", { class: "st" }, game.seen[i] ? [icon("check", "px xs"), "Vu"] : "Toucher")))));
    mount(v, h("button", { class: `btn${all ? " accent" : ""}`, type: "button", disabled: !all, onclick: startClues },
      all ? ["Lancer les indices", icon("play")] : `Encore ${plural(n - seenN, "joueur")}…`));
  }
  async function tapReveal(i) {
    const markSeen = () => { game.seen[i] = true; saveGame(); if (game.phase === "reveal") renderReveal(); };
    if (game.seen[i]) {
      if (await ask(`Revoir le mot de ${game.players[i].name} ?`, "Seulement si c'est bien toi et que personne ne regarde.", "Revoir")) openSecret(i);
    } else openSecret(i, markSeen);
  }

  function secretInfo(i) {
    const r = game.roles[i], W = game.words;
    if (r === "MRWHITE") return { role: r, cls: "mrw", top: "Tu es", word: "Mr White", hint: "Tu n'as pas de mot ! Écoute bien les indices des autres et bluffe pour survivre." };
    const word = r === "UNDERCOVER" ? W.undercover : W.citizen;
    if (game.cfg.hideRoles) return { role: null, cls: "", top: "Ton mot secret", word, hint: "Donne des indices assez clairs pour tes alliés… mais pas trop !" };
    return r === "UNDERCOVER"
      ? { role: r, cls: "und", top: "Undercover · ton mot", word, hint: "Les autres ont un mot différent. Fonds-toi dans la masse !" }
      : { role: r, cls: "cit", top: "Citizen · ton mot", word, hint: "Tu as le mot de la majorité. Démasque les imposteurs !" };
  }

  function openSecret(i, onSeen) {

      if (flipped) return;
      flipped = true;
      // Le mot n'est inséré dans la page qu'au moment où la carte se retourne
      const info = secretInfo(i);
      back.className = `face back${info.cls ? ` ${info.cls}` : ""}`;
      back.replaceChildren(...[
        info.role && sprite(info.role, "lg"),

    openModal(h("div", { class: "secret" },

  }

  // ============================================================
  // 2) INDICES
  // ============================================================
  function makeOrder() {
    const a = shuffle(aliveIdx());
    // Mr White ne commence jamais (trop dur sans mot)
    if (game.roles[a[0]] === "MRWHITE") {
      const k = a.findIndex((i) => game.roles[i] !== "MRWHITE");
      if (k > 0) [a[0], a[k]] = [a[k], a[0]];
    }
    return a;
  }
  function startClues() {
    game.order = makeOrder();
    game.speaker = 0;
    play("start");
    go("clues");
  }
  function renderClues() {
    const O = game.order, s = game.speaker, done = s >= O.length;
    const cw = game.cfg.clueWords === 1 ? "1 mot" : "1 ou 2 mots";
    let spot;
    if (done) {
      spot = h("div", { class: "spot" },
        h("div", { class: "hud y" }, "Fin du tour d'indices"),
        h("div", { class: "who" }, "Qui bluffe ?"),
        h("div", { class: "rule" }, game.cfg.timer ? "Place au débat, puis au vote." : "Débattez librement, puis votez."));
    } else {
      const p = game.players[O[s]];
      spot = h("div", { class: "spot" },
        h("div", { class: "hud y" }, `Indice ${s + 1} / ${O.length}`),

        h("div", { class: "rule" }, `Un indice de ${cw}`));
    }
    const v = h("div", null,
      topbar("Indices"),
      phases("clues"),
      spot,
      h("ol", { class: "order", "aria-label": "Ordre de parole" }, O.map((i, k) => h("li", { class: k < s ? "done" : k === s ? "cur" : "" },
        h("span", { class: "n" }, pad2(k + 1)), avatar(game.players[i], "sm"), h("span", null, game.players[i].name),
        k < s ? h("span", { class: "ok" }, icon("check", "px sm")) : null))),
      h("div", { class: "tip" }, icon("alert", "px sm"), h("span", null, "Interdit : dire le mot, un morceau du mot ou sa traduction. Pas de phrase !")));
    let d;
    if (!done) {
      const last = s === O.length - 1;
      d = h("div", { class: "dock-row" },
        h("button", { class: "btn ghost", type: "button", disabled: s === 0, "aria-label": "Joueur précédent", onclick: () => { game.speaker--; saveGame(); renderClues(); } }, icon("back")),
        h("button", { class: "btn", type: "button", onclick: () => { game.speaker++; saveGame(); play("tap"); renderClues(); } },
          last ? "Terminer le tour" : [auTourDe(game.players[O[s + 1]].name), icon("play")]));
    } else {
      d = [
        h("button", { class: "btn accent", type: "button", onclick: game.cfg.timer ? startDebate : goVote },
          game.cfg.timer ? `Lancer le débat · ${timerLabel(game.cfg.timer)}` : "Passer au vote"),
        h("div", { class: "two" },
          h("button", { class: "btn ghost sm", type: "button", onclick: () => { game.speaker = 0; saveGame(); play("tap"); renderClues(); } }, "Encore un tour"),
          game.cfg.timer ? h("button", { class: "btn ghost sm", type: "button", onclick: goVote }, "Voter directement") : null),
      ];
    }
    mount(v, d);
  }

  // ============================================================
  // 3) DÉBAT (compte à rebours façon arcade)
  // ============================================================
  const SEGMENTS = 20;
  let timerId = null, ring = null;
  const fmt = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : String(s));
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function startDebate() {
    game.total = game.cfg.timer;
    game.remaining = game.cfg.timer;
    game.paused = false;
    go("debate");
  }
  function renderDebate() {
    const num = h("span");
    const label = h("small");
    const bar = h("div", { class: "bar", "aria-hidden": "true" }, rep(SEGMENTS, null).map(() => h("i")));
    const box = h("div", { class: "ring", role: "timer", "aria-label": "Temps de débat restant" }, h("div", { class: "num" }, label, num), bar);
    const pauseBtn = h("button", { class: "btn ghost", type: "button", onclick: togglePause });
    const v = h("div", null,
      topbar("Débat"),
      phases("debate"),
      h("p", { class: "lead center" }, "Qui a un mot différent ? ", h("b", null, "Accusez, défendez‑vous, bluffez !")),
      box,
      h("div", { class: "two" }, pauseBtn, h("button", { class: "btn ghost", type: "button", onclick: addTime }, "+30 s")));
    mount(v, h("button", { class: "btn accent", type: "button", onclick: goVote }, "Voter maintenant"));
    ring = { box, num, label, pauseBtn, cells: [...bar.children] };
    updateRing();
    runTimer();
  }
  function updateRing() {
    if (!ring || !ring.box.isConnected) return;
    const r = game.remaining, t = Math.max(game.total, 1);
    ring.num.textContent = fmt(r);
    ring.label.textContent = game.paused ? "Pause" : "Temps";
    const lit = Math.ceil((r / t) * SEGMENTS);
    ring.cells.forEach((c, k) => c.classList.toggle("on", k < lit));
    ring.box.classList.toggle("warn", r <= 20 && r > 10);
    ring.box.classList.toggle("danger", r <= 10);
    ring.box.classList.toggle("paused", game.paused);
    ring.pauseBtn.replaceChildren(...(game.paused ? [icon("play", "px sm"), "Reprendre"] : [icon("pause", "px sm"), "Pause"]));
  }
  function runTimer() {
    stopTimer();
    if (!game || game.phase !== "debate" || game.paused) return;
    const endAt = Date.now() + game.remaining * 1000;
    timerId = setInterval(() => {
      const r = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      if (r !== game.remaining) {
        game.remaining = r;
        updateRing(); saveGame();
        if (r > 0 && r <= 5) play("tick");
      }
      if (r <= 0) {
        stopTimer();
        play("buzz"); vibrate([250, 120, 250]);
        goVote();
        toast("Temps écoulé ! Place au vote");
      }
    }, 200);
  }
  function togglePause() { game.paused = !game.paused; saveGame(); play("tap"); updateRing(); runTimer(); }
  function addTime() { game.remaining += 30; game.total = Math.max(game.total, game.remaining); saveGame(); play("tap"); updateRing(); runTimer(); }

  // ============================================================
  // 4) VOTE
  // ============================================================
  function goVote() {
    ui.vote = { sel: null, tie: false, tieSel: new Set(), spinning: false };
    go("vote");
  }
  function renderVote() {
    const V = ui.vote || (ui.vote = { sel: null, tie: false, tieSel: new Set(), spinning: false });
    const A = aliveIdx();
    const v = h("div", null,
      topbar("Vote"),
      phases("vote"),
      h("p", { class: "lead" }, V.tie
        ? ["Égalité : touchez ", h("b", null, "tous les ex-aequo"), ", le hasard tranchera."]
        : ["Votez à main levée, puis touchez ", h("b", null, "le joueur éliminé"), "."]),
      h("div", { class: `pgrid${A.length > 8 ? " dense" : ""}` }, A.map((i) => {
        const on = V.tie ? V.tieSel.has(i) : V.sel === i;
        return h("button", {
          class: `pcard${on ? " sel" : ""}`, type: "button", "data-i": i,
          "aria-pressed": String(on), disabled: V.spinning, onclick: () => pickVote(i),
        }, on ? h("span", { class: "mark" }, icon("check", "px xs")) : null, avatar(game.players[i], "lg"), h("span", { class: "nm" }, game.players[i].name));
      })));
    let d;
    if (V.tie) {
      d = [
        h("button", { class: "btn", type: "button", disabled: V.tieSel.size < 2 || V.spinning, onclick: spinTie },
          V.spinning ? "Tirage…" : [icon("dice"), `Tirer au sort (${V.tieSel.size})`]),
        h("button", { class: "btn ghost sm", type: "button", disabled: V.spinning, onclick: () => { V.tie = false; V.tieSel.clear(); renderVote(); } }, "Annuler l'égalité"),
      ];
    } else {
      const name = V.sel != null ? game.players[V.sel].name : null;
      d = [
        h("button", { class: `btn${name ? " pink" : ""}`, type: "button", disabled: V.sel == null, onclick: () => eliminate(V.sel) }, name ? `Éliminer ${name}` : "Touchez un joueur"),
        h("button", { class: "btn ghost sm", type: "button", onclick: () => {
          V.tie = true; V.tieSel = new Set(V.sel != null ? [V.sel] : []); V.sel = null; play("tap"); renderVote();
        } }, icon("dice", "px sm"), "Égalité ? Tirer au sort"),
      ];
    }
    mount(v, d);
  }
  function pickVote(i) {
    const V = ui.vote;
    if (V.spinning) return;
    if (V.tie) { if (V.tieSel.has(i)) V.tieSel.delete(i); else V.tieSel.add(i); }
    else V.sel = V.sel === i ? null : i;
    play("tap");
    renderVote();
  }
  function spinTie() {
    const V = ui.vote;
    const cands = [...V.tieSel];
    const winner = cands[Math.floor(Math.random() * cands.length)];
    const land = () => {
      V.spinning = false; V.tie = false; V.tieSel.clear(); V.sel = winner;
      play("good");
      toast(`Le sort a désigné ${game.players[winner].name} !`);
      renderVote();
    };
    if (reduced()) { land(); return; }
    V.spinning = true;
    renderVote();
    const cards = new Map([...view.querySelectorAll(".pcard")].map((el) => [Number(el.dataset.i), el]));
    const steps = [];
    const start = Math.floor(Math.random() * cands.length);
    for (let k = 0; k < 12 + cands.length * 2; k++) steps.push(cands[(start + k) % cands.length]);
    steps.push(winner);
    (function step(k) {
      if (!game || game.phase !== "vote") return;
      cards.forEach((el) => el.classList.remove("spin"));
      const el = cards.get(steps[k]);
      if (el) el.classList.add("spin");
      play("tick");
      if (k === steps.length - 1) { setTimeout(land, 650); return; }
      setTimeout(() => step(k + 1), 60 + Math.pow(k / steps.length, 2) * 320);
    })(0);
  }

  // ============================================================
  // 5) ÉLIMINATION
  // ============================================================
  function evaluate() {
    const { c, u, w } = counts();
    const idx = (pred) => game.roles.map((r, i) => (pred(r, i) ? i : -1)).filter((i) => i >= 0);
    if (u + w === 0) return { type: "CITIZENS", winners: idx((r) => r === "CITIZEN") };
    if (u + w >= c) {
      return {
        type: u && w ? "IMPOSTORS" : u ? "UNDERCOVER" : "MRWHITE",
        winners: idx((r, i) => (r === "UNDERCOVER" && u > 0) || (r === "MRWHITE" && game.alive[i])),
      };
    }
    return null;
  }
  function eliminate(i) {
    if (i == null) return;
    game.alive[i] = false;
    game.log.push({ round: game.round, i, role: game.roles[i] });
    game.elim = { i, guess: null, ok: null };
    // Mr White éliminé : il tente d'abord de deviner le mot, le verdict vient après
    game.outcome = game.roles[i] === "MRWHITE" ? null : evaluate();
    ui.fresh = true;
    play("drum");
    go("elim");
  }
  function renderElim() {
    const E = game.elim, i = E.i, p = game.players[i], r = game.roles[i], R = ROLES[r];
    const fresh = ui.fresh && !reduced();
    ui.fresh = false;
    const needGuess = r === "MRWHITE" && E.ok === null;
    const flavor = {
      CITIZEN: "Oups… c'était un innocent !",
      UNDERCOVER: "Bien joué, imposteur démasqué !",
      MRWHITE: needGuess ? "Démasqué… mais il lui reste une dernière chance !" : E.ok ? "Et il a trouvé le mot !" : "Pas de mot, pas de victoire !",
    }[r];
    const roleCard = h("div", { class: `rolecard ${R.cls}` },
      sprite(r, "xl"),
      h("div", { class: "rn" }, R.name),
      h("div", { class: "rf" }, flavor));
    const after = h("div", { class: "after" });
    if (r === "MRWHITE") after.append(guessBox());
    if (!needGuess) after.append(statusLine());
    const wait = h("div", { class: "wait", "aria-hidden": "true" }, h("span"), h("span"), h("span"));
    const v = h("div", null,
      topbar("Élimination", `Tour ${game.round} · Verdict`),
      phases("elim"),
      h("div", { class: "elim" },
        h("div", { class: "avwrap" }, avatar(p, "xl")),
        h("div", { class: "ename" }, p.name),
        h("div", { class: "suspense" }, "quitte la partie… et c'était :"),
        fresh ? wait : null,
        roleCard,
        after));
    const cont = h("button", { class: "btn accent", type: "button", onclick: nextFromElim },
      game.outcome ? ["Voir le résultat", icon("trophy")] : ["Tour suivant", icon("play")]);
    mount(v, needGuess ? null : cont);
    if (fresh) {
      roleCard.classList.add("hidden");
      after.classList.add("hidden");
      dock.classList.add("hidden");
      setTimeout(() => {
        if (!game || game.phase !== "elim" || !roleCard.isConnected) return;
        wait.remove();
        roleCard.classList.remove("hidden");
        after.classList.remove("hidden");
        if (!needGuess) dock.classList.remove("hidden");
        play(r === "CITIZEN" ? "bad" : "good");
        vibrate(r === "CITIZEN" ? [80, 60, 80] : 120);
        const inp = after.querySelector("input");
        if (inp) setTimeout(() => inp.focus(), 400);
      }, 1500);
    }
  }
  function statusLine() {
    if (game.outcome) return h("div", { class: "status" }, "La partie est terminée !");
    const { u, w } = counts();
    return h("div", { class: "status" }, `Il reste ${plural(aliveIdx().length, "joueur")}, dont ${plural(u + w, "imposteur")}.`);
  }
  function guessBox() {
    const E = game.elim, p = game.players[E.i];
    if (E.ok === null) {
      const inp = h("input", { class: "field", placeholder: "Le mot des Citizens", maxlength: "40", autocomplete: "off", autocapitalize: "off", spellcheck: "false", enterkeyhint: "done", "aria-label": "Proposition de Mr White" });
      const submit = (g) => { E.guess = g; E.ok = sameWord(g, game.words.citizen); resolveGuess(); };
      return h("form", { class: "guess", onsubmit: (e) => {
        e.preventDefault();
        const g = inp.value.trim();
        if (!g) { deny("Tape un mot, ou « Je sèche »", inp); inp.focus(); return; }
        submit(g);
      } },
        h("h3", null, "Dernière chance !"),
        h("p", { class: "note" }, `${p.name}, devine le mot des Citizens pour voler la victoire. Les accents ne comptent pas.`),
        inp,
        h("div", { class: "two" },
          h("button", { class: "btn ghost sm", type: "button", onclick: () => submit("") }, "Je sèche"),
          h("button", { class: "btn sm", type: "submit" }, "Valider")));
    }
    if (E.ok) return h("div", { class: "verdict ok" }, h("b", null, `« ${E.guess} »`), " : c'est le bon mot !");
    return h("div", { class: "verdict bad" },
      E.guess ? [h("b", null, `« ${E.guess} »`), " : raté !"] : "Pas de proposition.",
      E.guess ? h("button", { class: "link", type: "button", onclick: acceptGuess }, "Faute de frappe ? Les Citizens peuvent valider") : null);
  }
  function resolveGuess() {
    const E = game.elim;
    game.outcome = E.ok ? { type: "MRWHITE", winners: [E.i], guessed: true } : evaluate();
    play(E.ok ? "win" : "bad");
    saveGame();
    renderElim();
  }
  async function acceptGuess() {
    if (await ask("Valider quand même ?", "Seuls les Citizens connaissent le mot : validez si c'est juste une faute de frappe.", "Valider")) {
      game.elim.ok = true;
      resolveGuess();
    }
  }
  function nextFromElim() {
    if (game.outcome) { finish(); return; }
    game.round++;
    game.elim = null;
    startClues();
  }

  // ============================================================
  // 6) RÉSULTAT & MEILLEURS SCORES
  // ============================================================
  function loadScores() {
    const s = store.get(K.scores);
    return s && typeof s === "object" && s.players ? s : { games: 0, players: {} };
  }
  function applyScores() {
    const o = game.outcome;
    const S = loadScores();
    S.games = (S.games || 0) + 1;
    game.points = game.players.map(() => 0);
    o.winners.forEach((i) => { game.points[i] = ROLES[game.roles[i]].pts; });
    game.players.forEach((p, i) => {
      const key = normName(p.name);
      const e = S.players[key] || (S.players[key] = { name: p.name, pts: 0, wins: 0, games: 0 });
      Object.assign(e, { name: p.name, emoji: p.emoji, hue: p.hue, seed: seedOf(p) });
      e.games++;
      e.pts += game.points[i];
      if (game.points[i]) e.wins++;
    });
    store.set(K.scores, S);
  }
  function finish() {
    if (!game.scored) { applyScores(); game.scored = true; }
    store.del(K.game);
    releaseWake();
    ui.confetti = true;
    go("result");
  }
  function renderResult() {
    const o = game.outcome, W = game.words;
    const mrw = o.guessed ? game.players[o.winners[0]].name : null;
    const meta = {
      CITIZENS:   { cls: "cit", roles: ["CITIZEN"], title: "Les Citizens gagnent !", why: "Tous les imposteurs ont été démasqués." },
      UNDERCOVER: { cls: "und", roles: ["UNDERCOVER"], title: game.comp.u > 1 ? "Les Undercovers gagnent !" : "L'Undercover gagne !", why: "Les imposteurs sont aussi nombreux que les Citizens." },
      MRWHITE:    { cls: "mrw", roles: ["MRWHITE"], title: "Mr White gagne !", why: mrw ? `${mrw} a deviné le mot « ${W.citizen} » !` : "Mr White a tenu jusqu'au bout, sans aucun mot !" },
      IMPOSTORS:  { cls: "imp", roles: ["UNDERCOVER", "MRWHITE"], title: "Les imposteurs gagnent !", why: "Ils sont aussi nombreux que les Citizens." },
    }[o.type];
    const outRound = {};
    game.log.forEach((l) => { outRound[l.i] = l.round; });
    const win = new Set(o.winners);
    const order = game.players.map((p, i) => i).sort((a, b) => Number(win.has(b)) - Number(win.has(a)));
    const v = h("div", null,
      h("div", { class: `banner ${meta.cls}` },
        h("div", { class: "hud p blink" }, "Game over"),
        h("div", { class: "bsprites" }, meta.roles.map((r) => sprite(r, "lg"))),
        h("div", { class: "bt" }, meta.title),
        h("p", { class: "br" }, meta.why)),
      h("div", { class: "words" },
        h("div", { class: "wtile cit" }, h("div", { class: "hud" }, sprite("CITIZEN", "xs"), "Citizens"), h("b", null, W.citizen)),
        game.comp.u > 0
          ? h("div", { class: "wtile und" }, h("div", { class: "hud" }, sprite("UNDERCOVER", "xs"), "Undercover"), h("b", null, W.undercover))
          : h("div", { class: "wtile mrw" }, h("div", { class: "hud" }, sprite("MRWHITE", "xs"), "Mr White"), h("b", null, "Pas de mot"))),
      h("p", { class: "note center" }, `Thème : ${catLabel(W.cat)}`),
      h("section", { class: "sec" },
        h("div", { class: "sec-h" }, h("h2", null, "Les rôles"), h("span", { class: "count" }, plural(game.round, "tour"))),
        h("div", { class: "rlist" }, order.map((i) => {
          const p = game.players[i], role = game.roles[i], out = !game.alive[i];
          return h("div", { class: `rline${win.has(i) ? " win" : ""}${out ? " out" : ""}` },
            avatar(p, "md"),
            h("div", { class: "rn" }, h("b", null, p.name), h("small", null, out ? `Élimination au tour ${outRound[i]}` : "En jeu jusqu'au bout")),
            h("span", { class: `tag ${ROLES[role].cls}` }, sprite(role, "xs"), ROLES[role].name),
            h("span", { class: "pts" }, game.points && game.points[i] ? `+${game.points[i]}` : ""));
        }))),
      boardCard(game.players.map((p) => normName(p.name))));
    mount(v, [
      h("button", { class: "btn accent big", type: "button", onclick: rematch }, "Rejouer", icon("play")),
      h("button", { class: "btn ghost sm", type: "button", onclick: toLobby }, "Joueurs et réglages"),
    ]);
    if (ui.confetti) { ui.confetti = false; pixelConfetti(); play("win"); vibrate([60, 40, 60, 40, 120]); }
  }
  // Tableau des meilleurs scores, façon borne d'arcade
  function boardCard(onlyKeys, { title = true } = {}) {
    const S = loadScores();
    let rows = Object.entries(S.players);
    if (onlyKeys) rows = rows.filter(([k]) => onlyKeys.includes(k));
    rows = rows.map(([, e]) => e).sort((a, b) => b.pts - a.pts || b.wins - a.wins).slice(0, 30);
    const rank = (k) => (k === 0 ? "1er" : `${k + 1}e`);
    const list = rows.length
      ? h("div", { class: "rlist" }, rows.map((e, k) => h("div", { class: "rline" },
          h("span", { class: `rank${k < 3 ? ` r${k + 1}` : ""}` }, rank(k)),
          avatar(e, "sm"),
          h("div", { class: "rn" }, h("b", null, e.name), h("small", null, `${plural(e.wins, "victoire")} · ${plural(e.games, "partie")}`)),
          h("span", { class: "pts" }, String(e.pts).padStart(3, "0")))))
      : h("p", { class: "note" }, "Pas encore de partie terminée : les meilleurs scores apparaîtront ici.");
    return h("section", { class: title ? "sec" : null },
      title && h("div", { class: "sec-h" }, h("h2", null, "Meilleurs scores"), h("span", { class: "count" }, plural(S.games || 0, "partie"))),
      list,
      rows.length ? h("p", { class: "note center" }, "Victoire : Citizen +2 · Mr White +6 · Undercover +10") : null);
  }
  function rematch() {
    if (lobbyIssue()) { toLobby(); return; }
    startGame();
  }
  function toLobby() {
    stopTimer();
    fxRun++;
    game = null;
    render(true);
  }

  // ============================================================
  // MENUS & FEUILLES
  // ============================================================
  function menuItem(ic, title, sub, onclick, danger) {
    return h("button", { class: `menu-item${danger ? " danger" : ""}`, type: "button", onclick },
      h("span", { class: "mi" }, icon(ic)),
      h("div", null, h("b", null, title), sub && h("small", null, sub)));
  }
  function openMenu() {
    if (!game) return;
    sheet("Pause", h("div", null,
      menuItem("eye", "Revoir mon mot", "Pour ceux qui ont un trou de mémoire", () => { closeModal(); pickPeek(); }),
      menuItem("help", "Règles du jeu", null, () => { closeModal(); openRules(); }),
      menuItem("trophy", "Meilleurs scores", null, () => { closeModal(); openScores(); }),
      menuItem(prefs.sound ? "sound" : "mute", prefs.sound ? "Couper le son" : "Activer le son", null, () => {
        prefs.sound = !prefs.sound; savePrefs(); closeModal(); toast(prefs.sound ? "Son activé" : "Son coupé");
      }),
      menuItem("skull", "Abandonner la partie", "Retour à l'accueil, sans points", async () => {
        closeModal();
        if (await ask("Abandonner la partie ?", "La partie en cours sera perdue.", "Abandonner", true)) quitGame();
      }, true)));
  }
  function pickPeek() {
    const A = aliveIdx();
    sheet("Qui veut revoir son mot ?", h("div", { class: `pgrid${A.length > 8 ? " dense" : ""}` }, A.map((i) => h("button", {
      class: "pcard", type: "button", onclick: () => {
        closeModal();
        openSecret(i, game.phase === "reveal" ? () => { game.seen[i] = true; saveGame(); renderReveal(); } : null);
      },
    }, avatar(game.players[i], "lg"), h("span", { class: "nm" }, game.players[i].name)))));
  }
  function openScores() {
    sheet("Meilleurs scores", h("div", null,
      boardCard(null, { title: false }),
      h("button", { class: "link", type: "button", onclick: async () => {
        if (await ask("Remettre les scores à zéro ?", "Tout le classement sera effacé.", "Effacer", true)) {
          store.del(K.scores); closeModal(); toast("Scores remis à zéro");
        }
      } }, "Remettre les scores à zéro")));
  }
  function openRules() {
    const info = (role, name, txt) => h("div", { class: `rinfo ${ROLES[role].cls}` }, sprite(role, "md"), h("div", null, h("b", null, name), h("span", { class: "t" }, txt)));
    sheet("Comment jouer", h("div", { class: "rules" },
      h("p", null, "Tout le monde reçoit un mot secret… mais pas tout à fait le même ! Trouvez qui bluffe avant qu'il ne soit trop tard."),
      info("CITIZEN", "Citizens", "Ils ont tous le même mot. Leur mission : démasquer les imposteurs."),
      info("UNDERCOVER", "Undercover", "Un autre mot, du même univers mais bien différent (Sel / Farine). Avec les rôles secrets, il ne sait même pas qu'il est Undercover !"),
      info("MRWHITE", "Mr White", "Aucun mot ! Il écoute et bluffe. S'il est éliminé, il peut deviner le mot des Citizens pour gagner."),
      h("h3", null, "Déroulé"),
      h("ol", { class: "steps" },
        h("li", null, h("span", null, h("b", null, "Les mots. "), "Chacun découvre son mot en cachette sur le téléphone.")),
        h("li", null, h("span", null, h("b", null, "Les indices. "), "À tour de rôle, un indice court sur son mot. Mr White ne commence jamais.")),
        h("li", null, h("span", null, h("b", null, "Le débat. "), "On discute, on accuse, on se défend.")),
        h("li", null, h("span", null, h("b", null, "Le vote. "), "À main levée : le joueur éliminé révèle son rôle.")),
        h("li", null, h("span", null, "On recommence jusqu'à la victoire d'un camp."))),
      h("h3", null, "Victoire"),
      h("ul", { class: "wins" },
        h("li", null, sprite("CITIZEN"), h("span", null, "Citizens : tous les imposteurs sont éliminés.")),
        h("li", null, sprite("UNDERCOVER"), h("span", null, "Imposteurs : ils deviennent aussi nombreux que les Citizens.")),
        h("li", null, sprite("MRWHITE"), h("span", null, "Mr White : il devine le mot des Citizens quand il est éliminé."))),
      h("h3", null, "Points"),
      h("p", null, "Chaque gagnant marque : Citizen +2 · Mr White +6 · Undercover +10."),
      h("button", { class: "btn", type: "button", onclick: () => closeModal() }, "Compris !")));
  }

  // ---------- Fin de partie : confettis en pixels ----------
  function pixelConfetti() {
    if (reduced()) return;
    const cv = $("#fx"), ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = (cv.width = innerWidth * dpr), H = (cv.height = innerHeight * dpr);
    const cols = ["#ffd23f", "#ff4f8b", "#35e0ff", "#6dff9c", "#f4f4f6"];
    const u = 4 * dpr; // taille d'un « pixel »
    const P = Array.from({ length: 110 }, () => ({
      x: Math.random() * W, y: -Math.random() * H * 0.7,
      vx: (Math.random() - 0.5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr,
      s: u * (1 + ((Math.random() * 2) | 0)), c: cols[(Math.random() * cols.length) | 0],
    }));
    const t0 = performance.now(), life = 3800, run = fxRun;
    (function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      if (run !== fxRun) return;
      ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - life + 1000) / 1000);
      for (const p of P) {
        p.vy += 0.05 * dpr; p.x += p.vx; p.y += p.vy;
        ctx.fillStyle = p.c;
        ctx.fillRect(Math.round(p.x / u) * u, Math.round(p.y / u) * u, p.s, p.s);
      }
      if (el < life) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  // ---------- Démarrage ----------
  render(true);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
