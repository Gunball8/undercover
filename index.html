<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#2a0d63" />
  <meta name="description" content="Undercover & Mr White : le jeu d'imposteurs à jouer entre potes sur un seul téléphone." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Undercover" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" />
  <title>Undercover · Mr White</title>
  <style>
    :root {
      color-scheme: dark;
      --bg1:#3b1487; --bg2:#10052f;
      --card:#23105c; --card-2:#2c1672; --panel:#170a45; --edge:#4a2aa6; --edge-2:#6b48dc;
      --ink:#f7f2ff; --mut:#bcaaf0; --dim:#8c7bcc;
      --pink:#ff3d81; --pink-d:#b81f56;
      --yellow:#ffd23f; --yellow-d:#c99700;
      --cyan:#2de1fc; --cyan-d:#0a9fb8;
      --lime:#8aff5e; --lime-d:#46b31f;
      --red:#ff5d6c;
      --cit:#2de1fc; --und:#ff3d81; --mrw:#f1ecff;
      --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
      --shadow:0 6px 0 rgba(0,0,0,.35);
      --st:env(safe-area-inset-top,0px);
      --sb:env(safe-area-inset-bottom,0px);
      --dock-h:120px;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { height:100%; }
    body {
      margin:0; min-height:100%; color:var(--ink); background:var(--bg2);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none; /* pas de pull-to-refresh accidentel en pleine partie */
    }
    body::before {
      content:""; position:fixed; inset:0; z-index:-1;
      background:
        radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.6px) 0 0/22px 22px,
        radial-gradient(900px 600px at 0% -10%, #5a1fb8 0%, transparent 60%),
        radial-gradient(800px 600px at 110% 0%, #7a1a74 0%, transparent 55%),
        linear-gradient(170deg, var(--bg1), var(--bg2) 75%);
    }
    body.locked { overflow:hidden; }
    #app { max-width:560px; margin:0 auto; padding:calc(12px + var(--st)) 16px calc(var(--dock-h) + 24px); }
    button { font:inherit; color:inherit; border:0; background:none; padding:0; margin:0; cursor:pointer; touch-action:manipulation; }
    input { font:inherit; }
    :focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
    .hidden { display:none !important; }
    .center { text-align:center; }
    .muted { color:var(--mut); }
    .note { font-size:13px; color:var(--mut); margin:10px 0 0; line-height:1.45; }

    /* ---------- Boutons ---------- */
    .btn {
      display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
      min-height:56px; padding:12px 18px; border-radius:18px;
      background:var(--pink); color:#fff; box-shadow:0 6px 0 var(--pink-d), 0 12px 24px rgba(0,0,0,.3);
      font-family:var(--display); font-size:21px; letter-spacing:.03em; line-height:1.1; text-align:center;
      transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    }
    .btn:active:not(:disabled) { transform:translateY(5px); box-shadow:0 1px 0 var(--pink-d); }
    .btn:disabled { filter:grayscale(.75) brightness(.6); cursor:default; }
    .btn.yellow { background:var(--yellow); color:#2a0e5e; box-shadow:0 6px 0 var(--yellow-d), 0 12px 24px rgba(0,0,0,.3); }
    .btn.yellow:active:not(:disabled) { box-shadow:0 1px 0 var(--yellow-d); }
    .btn.cyan { background:var(--cyan); color:#10053a; box-shadow:0 5px 0 var(--cyan-d); }
    .btn.cyan:active:not(:disabled) { box-shadow:0 1px 0 var(--cyan-d); }
    .btn.ghost {
      background:var(--panel); color:var(--ink); border:2px solid var(--edge); box-shadow:0 4px 0 rgba(0,0,0,.35);
      font-family:inherit; font-weight:800; font-size:15px; letter-spacing:0; min-height:48px;
    }
    .btn.ghost:active:not(:disabled) { box-shadow:none; transform:translateY(4px); }
    .btn.ghost:disabled { filter:none; opacity:.4; }
    .btn.sm { min-height:46px; font-size:16px; padding:8px 14px; border-radius:14px; }
    .btn.ghost.sm { font-size:14px; }
    .btn.big { min-height:64px; font-size:24px; }
    .iconbtn {
      width:46px; height:46px; flex:none; border-radius:14px; display:grid; place-items:center;
      background:var(--panel); border:2px solid var(--edge); font-size:20px; box-shadow:0 4px 0 rgba(0,0,0,.35);
    }
    .iconbtn:active { transform:translateY(3px); box-shadow:none; }
    .linkbtn { color:var(--mut); font-weight:700; font-size:14px; text-decoration:underline; text-underline-offset:3px; padding:10px; display:block; margin:6px auto 0; }
    .mini {
      font-size:13px; font-weight:800; color:var(--cyan); padding:7px 11px; border-radius:11px;
      background:var(--panel); border:2px solid var(--edge);
    }
    .mini:active { transform:scale(.96); }

    /* ---------- Accueil ---------- */
    .hero { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0 10px; }
    .logo {
      margin:0; min-width:0; font-family:var(--display); font-weight:400; font-size:clamp(28px, 10.5vw, 42px); line-height:.9; letter-spacing:.02em;
      color:var(--yellow); text-shadow:3px 3px 0 var(--pink), 6px 6px 0 rgba(0,0,0,.25); transform:rotate(-3deg);
    }
    .logo small { display:block; font-size:16px; color:var(--cyan); text-shadow:2px 2px 0 rgba(0,0,0,.4); letter-spacing:.14em; margin-top:6px; }
    .hero-actions { display:flex; gap:8px; flex:none; }
    @media (max-width:360px) { .hero-actions { gap:6px; } .hero-actions .iconbtn { width:40px; height:40px; font-size:18px; } }
    .card {
      margin-top:14px; padding:16px; border-radius:24px;
      background:linear-gradient(180deg, var(--card-2), var(--card)); border:2px solid var(--edge); box-shadow:var(--shadow);
    }
    .card-h { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .card-h h2 { margin:0; font-family:var(--display); font-weight:400; font-size:23px; letter-spacing:.03em; color:var(--cyan); text-shadow:2px 2px 0 rgba(0,0,0,.4); }
    .pill {
      display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; white-space:nowrap;
      background:var(--panel); border:2px solid var(--edge); color:var(--mut); font-size:13px; font-weight:800;
    }
    .resume {
      margin-top:6px; padding:14px; border-radius:20px; display:grid; gap:12px;
      background:linear-gradient(135deg, #5b1a8f, #3a1380); border:2px solid var(--yellow); box-shadow:var(--shadow);
      animation:pop .35s ease both;
    }
    .resume b { font-family:var(--display); font-weight:400; font-size:21px; color:var(--yellow); }

    /* Joueurs */
    .plist { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; }
    .prow { min-width:0; display:flex; align-items:center; gap:6px; padding:5px 5px 5px 7px; border-radius:16px; background:var(--panel); border:2px solid var(--edge); animation:fadeUp .2s ease both; }
    .prow:focus-within { border-color:var(--edge-2); }
    .prow.dup { border-color:var(--red); }
    .avbtn { border-radius:50%; }
    .avbtn:active { transform:scale(.9); }
    .pname { flex:1; width:0; min-width:0; background:transparent; border:0; outline:none; color:var(--ink); font-size:17px; font-weight:700; padding:10px 4px; }
    .x { width:40px; height:40px; flex:none; border-radius:12px; color:var(--mut); font-size:16px; display:grid; place-items:center; }
    .x:hover, .x:active { background:rgba(255,93,108,.15); color:var(--red); }
    .padd { display:flex; gap:8px; margin-top:10px; }
    .padd input {
      flex:1; min-width:0; padding:12px 14px; border-radius:16px; outline:none;
      border:2px dashed var(--edge-2); background:rgba(0,0,0,.2); color:var(--ink); font-size:17px; font-weight:600;
    }
    .padd input:focus { border-style:solid; border-color:var(--cyan); }
    .padd .btn { width:auto; flex:none; }
    .empty { color:var(--mut); font-size:14px; text-align:center; padding:12px; border:2px dashed var(--edge); border-radius:16px; }

    /* Avatars */
    .av {
      display:inline-grid; place-items:center; flex:none; border-radius:50%; line-height:1;
      background:hsl(var(--h,260) 75% 60% / .22); border:2px solid hsl(var(--h,260) 85% 68%);
    }
    .av, .ric, .comp, .bemo, .bigemo, .re, .be, .drum, .rinfo .e, .mi, .rank {
      font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--display);
    }
    .av-sm { width:30px; height:30px; font-size:16px; }
    .av-md { width:44px; height:44px; font-size:24px; }
    .av-lg { width:60px; height:60px; font-size:32px; }
    .av-xl { width:96px; height:96px; font-size:54px; border-width:3px; }

    /* Rôles */
    .comp {
      display:flex; flex-wrap:wrap; justify-content:center; gap:4px; min-height:54px; align-items:center;
      padding:10px; margin-bottom:6px; border-radius:16px; background:rgba(0,0,0,.22); font-size:24px;
    }
    .comp span { animation:pop .25s ease both; }
    .rrow { display:flex; align-items:center; gap:12px; padding:10px 2px; }
    .rrow + .rrow { border-top:1px dashed rgba(255,255,255,.1); }
    .ric { font-size:30px; width:38px; text-align:center; flex:none; }
    .rtxt { flex:1; min-width:0; }
    .rtxt b { display:block; font-size:17px; }
    .rtxt small { color:var(--mut); font-size:13px; }
    .rrow.cit b { color:var(--cit); } .rrow.und b { color:var(--und); } .rrow.mrw b { color:var(--mrw); }
    .stepper { display:flex; align-items:center; gap:2px; padding:3px; border-radius:14px; background:var(--panel); border:2px solid var(--edge); }
    .stepper button { width:42px; height:40px; border-radius:10px; font-size:24px; font-weight:900; color:var(--yellow); }
    .stepper button:disabled { color:var(--dim); opacity:.35; cursor:default; }
    .stepper button:not(:disabled):active { background:rgba(255,255,255,.1); }
    .stepper output { min-width:26px; text-align:center; font-family:var(--display); font-size:23px; }
    .cnum { min-width:96px; text-align:center; font-family:var(--display); font-size:25px; color:var(--cit); }

    /* Thèmes */
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip {
      display:inline-flex; align-items:center; gap:6px; padding:9px 12px; border-radius:999px;
      background:var(--panel); border:2px solid var(--edge); color:var(--mut); font-weight:700; font-size:14px;
      transition:transform .08s ease, background .15s ease;
    }
    .chip:active { transform:scale(.94); }
    .chip.on { background:#173d2a; border-color:var(--lime); color:var(--ink); }
    .chip-n { font-size:11px; font-weight:900; padding:2px 6px; border-radius:999px; background:rgba(0,0,0,.3); color:var(--mut); }
    .chip.on .chip-n { color:var(--lime); }
    .row-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }

    /* Options */
    .opt + .opt { margin-top:14px; }
    .opt-l { font-weight:800; font-size:15px; margin-bottom:8px; }
    .seg { display:flex; gap:4px; padding:4px; border-radius:16px; background:var(--panel); border:2px solid var(--edge); overflow-x:auto; scrollbar-width:none; }
    .seg::-webkit-scrollbar { display:none; }
    .seg button { flex:1 0 auto; padding:10px 8px; border-radius:11px; font-weight:800; font-size:14px; color:var(--mut); white-space:nowrap; }
    .seg button.on { background:var(--yellow); color:#2a0e5e; box-shadow:0 3px 0 var(--yellow-d); }
    .switch-row { display:flex; align-items:center; gap:12px; margin-top:12px; padding:12px; border-radius:16px; background:var(--panel); border:2px solid var(--edge); cursor:pointer; }
    .sw-txt { flex:1; }
    .sw-txt b { display:block; font-size:15px; }
    .sw-txt small { display:block; margin-top:3px; color:var(--mut); font-size:13px; line-height:1.35; }
    .sw {
      appearance:none; -webkit-appearance:none; position:relative; flex:none; margin:0; cursor:pointer;
      width:54px; height:32px; border-radius:999px; background:#3b2a73; border:2px solid var(--edge); transition:background .2s;
    }
    .sw::before { content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.4); transition:transform .2s; }
    .sw:checked { background:var(--lime-d); border-color:var(--lime); }
    .sw:checked::before { transform:translateX(22px); }
    .foot { text-align:center; color:var(--dim); font-size:13px; margin:18px 0 0; line-height:1.4; }

    /* ---------- Dock (actions en bas) ---------- */
    .dock {
      position:fixed; left:0; right:0; bottom:0; z-index:20; pointer-events:none;
      padding:22px 16px calc(14px + var(--sb));
      background:linear-gradient(to top, rgba(16,5,47,.97) 62%, rgba(16,5,47,0));
    }
    .dock-in { max-width:560px; margin:0 auto; display:grid; gap:10px; pointer-events:auto; }
    .dock-msg { text-align:center; font-size:14px; font-weight:800; color:var(--yellow); }
    .dock-row { display:grid; grid-template-columns:auto 1fr; gap:10px; }
    .dock-row > .btn.ghost:first-child { width:64px; font-size:20px; }
    .two { display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:10px; }

    /* ---------- En jeu ---------- */
    .topbar { display:flex; align-items:center; gap:12px; padding:4px 0 12px; }
    .tb-txt { flex:1; min-width:0; }
    .tb-kick { font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); }
    .tb-title { margin:3px 0 0; font-family:var(--display); font-weight:400; font-size:32px; line-height:1; color:var(--yellow); text-shadow:2px 2px 0 var(--pink); }
    .phases { display:flex; gap:6px; margin-bottom:14px; }
    .phases span {
      flex:1; text-align:center; padding:7px 4px; border-radius:999px; white-space:nowrap;
      background:var(--panel); border:2px solid var(--edge); color:var(--dim); font-size:12px; font-weight:800;
    }
    .phases span.on { background:var(--cyan); border-color:var(--cyan); color:#10053a; }
    .phases span.done { color:var(--mut); }
    .lead { margin:0 0 16px; font-size:16px; line-height:1.45; color:var(--mut); }
    .lead b { color:var(--ink); }

    .pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; }
    .pcard {
      position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
      padding:16px 10px 14px; border-radius:20px; border:2px solid var(--edge); box-shadow:var(--shadow);
      background:linear-gradient(180deg, var(--card-2), var(--card));
      transition:transform .12s ease, border-color .15s ease, background .15s ease, opacity .2s ease;
    }
    .pcard:active:not(:disabled) { transform:translateY(3px) scale(.98); }
    .pcard .nm { font-weight:800; font-size:17px; line-height:1.15; overflow-wrap:anywhere; }
    .pcard .st { font-size:11px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
    .pcard.done { opacity:.55; box-shadow:none; background:var(--panel); }
    .pcard.done .st { color:var(--lime); }
    .pcard.next { border-color:var(--yellow); animation:glow 1.4s ease-in-out infinite; }
    .pcard.sel { border-color:var(--pink); background:linear-gradient(180deg, #5d1752, #3a0f45); transform:translateY(-3px); }
    .pcard.sel::after { content:"🎯"; position:absolute; top:8px; right:10px; font-size:20px; }
    .pcard.tie.sel::after { content:"⚖️"; }
    .pcard.spin { border-color:var(--yellow); background:linear-gradient(180deg, #6b4f0c, #3d2a05); transform:scale(1.04); }
    .pcard:disabled { cursor:default; }
    .pgrid.dense { grid-template-columns:repeat(auto-fill, minmax(100px,1fr)); gap:10px; }
    .pgrid.dense .pcard { padding:12px 6px 10px; gap:6px; }
    .pgrid.dense .av-lg { width:48px; height:48px; font-size:26px; }
    .pgrid.dense .nm { font-size:15px; }

    /* Indices */
    .spot {
      display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
      padding:22px 16px; border-radius:28px; border:3px solid var(--yellow); box-shadow:0 8px 0 rgba(0,0,0,.35);
      background:radial-gradient(circle at 50% 0%, #4d2cb8, var(--card) 70%);
      animation:pop .35s cubic-bezier(.3,1.5,.5,1) both;
    }
    .spot .kick { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); }
    .spot .who { font-family:var(--display); font-size:clamp(36px, 11vw, 52px); line-height:1; overflow-wrap:anywhere; }
    .spot .rule { font-size:15px; font-weight:600; color:var(--mut); }
    .spot .bigemo { font-size:64px; line-height:1; }
    .order { list-style:none; margin:16px 0 0; padding:0; display:grid; gap:6px; }
    .order li { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:14px; background:var(--panel); border:2px solid transparent; font-weight:700; }
    .order li .n { width:22px; font-family:var(--display); color:var(--dim); }
    .order li.cur { border-color:var(--yellow); background:#3a2a0a; }
    .order li.cur .n { color:var(--yellow); }
    .order li.done { opacity:.5; }
    .order li.done::after { content:"✓"; margin-left:auto; color:var(--lime); font-weight:900; }
    .tip { margin-top:14px; padding:12px 14px; border-radius:16px; border:2px dashed var(--edge-2); color:var(--mut); font-size:14px; line-height:1.45; }

    /* Débat */
    .ring { position:relative; width:min(76vw, 290px); aspect-ratio:1; margin:4px auto 20px; }
    .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
    .ring .trk { fill:none; stroke:var(--panel); stroke-width:16; }
    .ring .bar { fill:none; stroke:var(--cyan); stroke-width:16; stroke-linecap:round; transition:stroke-dashoffset .3s linear, stroke .3s ease; }
    .ring.warn .bar { stroke:var(--yellow); }
    .ring.danger .bar { stroke:var(--red); }
    .ring .num { position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:4px; }
    .ring .num span { font-family:var(--display); font-size:clamp(64px, 22vw, 96px); line-height:1; }
    .ring .num small { font-size:12px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); }
    .ring.danger .num span { color:var(--red); animation:pulse .5s ease infinite alternate; }
    .ring.paused .num span { opacity:.45; }

    /* Élimination */
    .elim { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; padding-top:6px; }
    .avwrap { position:relative; }
    .avwrap::after {
      content:"✕"; position:absolute; inset:0; display:grid; place-items:center; font-size:70px; font-weight:900;
      color:var(--red); text-shadow:0 3px 0 rgba(0,0,0,.45); animation:stamp .4s .25s ease both;
    }
    .avwrap .av { filter:grayscale(.4); }
    .ename { font-family:var(--display); font-size:clamp(34px, 10vw, 48px); line-height:1; overflow-wrap:anywhere; }
    .suspense { font-size:17px; font-weight:700; color:var(--mut); }
    .drum { font-size:44px; animation:bounce .28s ease-in-out infinite alternate; }
    .rolecard {
      width:100%; margin-top:6px; padding:22px 16px; border-radius:26px; box-shadow:0 8px 0 rgba(0,0,0,.35);
      display:flex; flex-direction:column; align-items:center; gap:6px;
      animation:flipIn .6s cubic-bezier(.3,1.4,.5,1) both;
    }
    .rolecard .re { font-size:64px; line-height:1; }
    .rolecard .rl { font-size:13px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; opacity:.75; }
    .rolecard .rn { font-family:var(--display); font-size:44px; line-height:1; }
    .rolecard .rf { font-size:15px; font-weight:700; }
    .cit-bg { background:var(--cit); color:#062a33; }
    .und-bg { background:var(--pink); color:#fff; }
    .mrw-bg { background:#fbf8ff; color:#2a0e5e; }
    .guess { width:100%; display:grid; gap:10px; padding:16px; border-radius:22px; text-align:left; background:var(--card); border:2px solid var(--mrw); animation:fadeUp .3s ease both; }
    .guess h3 { margin:0; font-family:var(--display); font-weight:400; font-size:24px; }
    .guess .note { margin:0; }
    .field {
      width:100%; padding:14px 16px; border-radius:16px; outline:none;
      border:2px solid var(--edge-2); background:var(--panel); color:var(--ink); font-size:18px; font-weight:700;
    }
    .field:focus { border-color:var(--cyan); }

          seg(TIMERS, prefs.timer, (x) => { prefs.timer = x; savePrefs(); })),
        h("div", { class: "opt" }, h("div", { class: "opt-l" }, "💬 Longueur des indices"),
          seg([[1, "1 seul mot"], [2, "1 ou 2 mots"]], prefs.clueWords, (x) => { prefs.clueWords = x; savePrefs(); })),
        switchRow("🙈 Rôles secrets", "Chacun ne voit que son mot : l'Undercover ne sait pas qu'il est Undercover.", prefs.hideRoles, (x) => { prefs.hideRoles = x; savePrefs(); }),
        switchRow("🔊 Sons & vibrations", null, prefs.sound, (x) => { prefs.sound = x; savePrefs(); if (x) play("tap"); })),

      h("p", { class: "foot" }, "💡 Ajoute la page à ton écran d'accueil : plein écran, et ça marche même sans réseau.")
    );
    E.msg = h("div", { class: "dock-msg" });
    E.play = h("button", { class: "btn big", type: "button", onclick: startGame });
    mount(v, [E.msg, E.play]);
    refreshLobby();
  }

  function refreshLobby() {
    const E = lobby;
    const n = prefs.players.length;
    E.pcount.textContent = plural(n, "joueur");
    E.plist.replaceChildren(...(n
      ? prefs.players.map((p, i) => playerRow(p, i))
      : [h("div", { class: "empty" }, "Ajoute au moins 3 joueurs pour lancer une partie 👇")]));
    E.addBtn.disabled = n >= MAX_P;
    E.addInput.disabled = n >= MAX_P;
    E.addInput.placeholder = n >= MAX_P ? `${MAX_P} joueurs maximum` : `Prénom du joueur ${n + 1}…`;
    markDups();
    renderRolesBox();
    renderChips();
    refreshDock();
  }

  function playerRow(p, i) {
    return h("div", { class: "prow" },
      h("button", { class: "avbtn", type: "button", "aria-label": `Changer l'avatar de ${p.name || "ce joueur"}`, onclick: () => cycleAvatar(i) }, avatar(p, "md")),
      h("input", {
        class: "pname", value: p.name, maxlength: "20", autocomplete: "off", autocapitalize: "words", enterkeyhint: "done",
        "aria-label": `Nom du joueur ${i + 1}`,
        oninput: (e) => { p.name = e.target.value; savePrefs(); markDups(); refreshDock(); },
        onkeydown: (e) => { if (e.key === "Enter") e.target.blur(); },
        onblur: (e) => { p.name = e.target.value.trim(); e.target.value = p.name; savePrefs(); markDups(); refreshDock(); },
      }),
      h("button", { class: "x", type: "button", "aria-label": `Retirer ${p.name || "ce joueur"}`, onclick: () => {
        prefs.players.splice(i, 1); savePrefs(); play("tap"); refreshLobby();
      } }, "✕"));
  }

  function addPlayer() {
    const E = lobby;
    if (prefs.players.length >= MAX_P) return;
    let name = E.addInput.value.trim().slice(0, 20);
    if (!name) {
      let k = prefs.players.length + 1;
      while (prefs.players.some((p) => normName(p.name) === normName(`Joueur ${k}`))) k++;
      name = `Joueur ${k}`;
    }
    if (prefs.players.some((p) => normName(p.name) === normName(name))) {
      toast(`« ${name} » est déjà dans la partie`);
      E.addInput.classList.remove("shake"); void E.addInput.offsetWidth; E.addInput.classList.add("shake");
      return;
    }
    const usedE = new Set(prefs.players.map((p) => p.emoji));
    const usedH = new Set(prefs.players.map((p) => p.hue));
    prefs.players.push({
      name,
      emoji: AVATARS.find((e) => !usedE.has(e)) || AVATARS[Math.floor(Math.random() * AVATARS.length)],
      hue: HUES.find((x) => !usedH.has(x)) ?? HUES[prefs.players.length % HUES.length],
    });
    savePrefs();
    play("tap");
    E.addInput.value = "";
    refreshLobby();
    E.addInput.focus();
    E.addInput.scrollIntoView({ block: "nearest" });
  }

  function cycleAvatar(i) {
    const used = new Set(prefs.players.map((p) => p.emoji));
    const cur = AVATARS.indexOf(prefs.players[i].emoji);
    for (let k = 1; k <= AVATARS.length; k++) {
      const e = AVATARS[(cur + k + AVATARS.length) % AVATARS.length];
      if (!used.has(e)) { prefs.players[i].emoji = e; break; }
    }
    savePrefs();
    play("tap");
    refreshLobby();
  }

  function dupIndexes() {
    const seen = new Map(), d = new Set();
    prefs.players.forEach((p, i) => {
      const k = normName(p.name);
      if (!k) return;
      if (seen.has(k)) { d.add(i); d.add(seen.get(k)); } else seen.set(k, i);
    });
    return d;
  }
  function markDups() {
    const d = dupIndexes();
    lobby.plist.querySelectorAll(".prow").forEach((row, i) => row.classList.toggle("dup", d.has(i)));
  }

  function lobbyIssue() {
    const P = prefs.players, n = P.length;
    if (n < MIN_P) return `Encore ${plural(MIN_P - n, "joueur")} à ajouter`;
    if (P.some((p) => !p.name.trim())) return "Un joueur n'a pas de prénom";
    const d = [...dupIndexes()];
    if (d.length) return `Deux joueurs s'appellent « ${P[d[0]].name.trim()} »`;
    if (!poolSize()) return "Choisis au moins un thème";
    return null;
  }
  function refreshDock() {
    const E = lobby;
    if (!E) return;
    const issue = lobbyIssue();
    E.msg.textContent = issue || "";
    E.msg.classList.toggle("hidden", !issue);
    E.play.disabled = !!issue;
    E.play.textContent = issue ? "Jouer" : `Jouer à ${prefs.players.length} ▶`;
  }

  function renderRolesBox() {
    const E = lobby;
    const n = prefs.players.length;
    const { c, u, w } = comp();
    const m = maxImpostors(n);
    const ready = n >= MIN_P;
    E.auto.classList.toggle("hidden", !prefs.manual);
    const change = (du, dw) => {
      const cc = comp();
      prefs.manual = true;
      prefs.undercover = cc.u + du;
      prefs.mrwhite = cc.w + dw;
      savePrefs(); play("tap"); renderRolesBox(); refreshDock();
    };
    const stepper = (val, label, canDown, canUp, onDown, onUp) => h("div", { class: "stepper" },
      h("button", { type: "button", "aria-label": `Moins de ${label}`, disabled: !canDown, onclick: onDown }, "−"),
      h("output", { "aria-live": "polite" }, val),
      h("button", { type: "button", "aria-label": `Plus de ${label}`, disabled: !canUp, onclick: onUp }, "+"));
    const roleRow = (cls, emo, name, desc, ctrl) => h("div", { class: `rrow ${cls}` },
      h("span", { class: "ric", "aria-hidden": "true" }, emo),
      h("div", { class: "rtxt" }, h("b", null, name), h("small", null, desc)),
      ctrl);
    E.roles.replaceChildren(
      h("div", { class: "comp", "aria-label": ready ? `${c} Citizens, ${u} Undercover, ${w} Mr White` : "En attente de joueurs" },
        ready ? [...rep(c, "😇"), ...rep(u, "🕵️"), ...rep(w, "👻")].map((e) => h("span", null, e)) : h("span", { class: "note" }, "En attente de joueurs…")),
      roleRow("cit", "😇", "Citizens", "Ont tous le même mot", h("div", { class: "cnum" }, ready ? c : "–")),
      roleRow("und", "🕵️", "Undercover", "Un autre mot, du même univers", stepper(u, "Undercover",
        ready && u > 0 && u + w > 1, ready && u + w < m, () => change(-1, 0), () => change(1, 0))),
      roleRow("mrw", "👻", "Mr White", "Aucun mot : il doit bluffer", stepper(w, "Mr White",
        ready && w > 0 && u + w > 1, ready && u + w < m, () => change(0, -1), () => change(0, 1))),
      h("p", { class: "note" },
        prefs.manual ? "Composition perso. " : `Composition conseillée pour ${Math.max(n, MIN_P)} joueurs. `,
        "Les imposteurs gagnent s'ils deviennent aussi nombreux que les Citizens."));
  }

  function renderChips() {
    const E = lobby;
    const b = bank(), off = new Set(prefs.off);
    E.chips.replaceChildren(...Object.keys(b).map((cat) => {
      const on = !off.has(cat);
      const [emo, ...rest] = cat.split(" ");
      return h("button", {
        class: `chip${on ? " on" : ""}`, type: "button", "aria-pressed": String(on),
        onclick: () => {
          prefs.off = on ? [...prefs.off, cat] : prefs.off.filter((c) => c !== cat);
          savePrefs(); play("tap"); renderChips(); refreshDock();
        },
      }, h("span", { "aria-hidden": "true" }, emo), h("span", null, rest.join(" ")), h("span", { class: "chip-n" }, b[cat].length));
    }));
    E.pool.textContent = `${poolSize()} paires`;
    E.customBtn.textContent = `✏️ Mes paires (${prefs.custom.length})`;
  }

  function seg(options, value, onChange) {
    const wrap = h("div", { class: "seg", role: "radiogroup" });
    options.forEach(([val, label]) => wrap.append(h("button", {
      type: "button", role: "radio", class: val === value ? "on" : "", "aria-checked": String(val === value),
      onclick: (e) => {
        onChange(val); play("tap");
        [...wrap.children].forEach((b) => { b.classList.toggle("on", b === e.currentTarget); b.setAttribute("aria-checked", String(b === e.currentTarget)); });
      },
    }, label)));
    return wrap;
  }
  function switchRow(label, desc, checked, onChange) {
    return h("label", { class: "switch-row" },
      h("div", { class: "sw-txt" }, h("b", null, label), desc && h("small", null, desc)),
      h("input", { type: "checkbox", class: "sw", checked, onchange: (e) => onChange(e.target.checked) }));
  }

  function openCustom() {
    const list = h("div", { class: "cp-list" });
    const a = h("input", { class: "field", placeholder: "Mot 1", maxlength: "30", autocomplete: "off", "aria-label": "Premier mot" });
    const b = h("input", { class: "field", placeholder: "Mot 2", maxlength: "30", autocomplete: "off", "aria-label": "Deuxième mot" });
    const draw = () => {
      list.replaceChildren(...(prefs.custom.length
        ? prefs.custom.map((pr, i) => h("div", { class: "cp-row" },
            h("span", null, pr[0]), h("span", { class: "vs" }, "vs"), h("span", null, pr[1]),
            h("button", { class: "x", type: "button", "aria-label": `Supprimer ${pr[0]} / ${pr[1]}`, onclick: () => {
              prefs.custom.splice(i, 1); savePrefs(); draw(); if (lobby) { renderChips(); refreshDock(); }
            } }, "✕")))
        : [h("div", { class: "empty" }, "Aucune paire perso pour l'instant.")]));
    };
    const submit = (e) => {
      e.preventDefault();
      const x = a.value.trim(), y = b.value.trim();
      if (!x || !y) { toast("Il faut deux mots"); (x ? b : a).focus(); return; }
      if (sameWord(x, y)) { toast("Les deux mots doivent être différents"); return; }
      if (prefs.custom.some(([p, q]) => (sameWord(p, x) && sameWord(q, y)) || (sameWord(p, y) && sameWord(q, x)))) { toast("Cette paire existe déjà"); return; }
      prefs.custom.push([x, y]);
      savePrefs(); play("tap");
      a.value = ""; b.value = ""; a.focus();
      draw();
      if (lobby) { renderChips(); refreshDock(); }
    };
    sheet("✏️ Mes paires perso", h("div", null,
      h("p", { class: "note", style: "margin:0 0 14px" },
        "Deux mots du même univers, mais pas le jumeau évident. Évite Sel / Poivre (trop facile à deviner), préfère Sel / Farine. Tes paires forment le thème « Perso »."),
      h("form", { onsubmit: submit },
        h("div", { class: "cp-form" }, a, h("span", { class: "vs" }, "vs"), b),
        h("button", { class: "btn cyan sm", type: "submit", style: "margin-top:10px" }, "＋ Ajouter la paire")),
      list));
    draw();
  }

  // ============================================================
  // LANCEMENT / REPRISE / ABANDON
  // ============================================================
  function startGame() {
    if (lobbyIssue()) { toast(lobbyIssue()); return; }
    unlockAudio();
    const { c, u, w } = comp();
    const roles = shuffle([...rep(c, "CITIZEN"), ...rep(u, "UNDERCOVER"), ...rep(w, "MRWHITE")]);
    game = {
      v: 2,
      players: prefs.players.map((p) => ({ name: p.name.trim(), emoji: p.emoji, hue: p.hue })),
      roles,
      alive: roles.map(() => true),
      seen: roles.map(() => false),
      words: pickWords(),
      cfg: { timer: prefs.timer, clueWords: prefs.clueWords, hideRoles: prefs.hideRoles },
      comp: { c, u, w },
      round: 1, order: [], speaker: 0,
      remaining: 0, total: 0, paused: false,
      elim: null, log: [], outcome: null, scored: false, points: null,
      phase: "reveal",
    };
    lobby = null;
    keepAwake(); armBack(); play("start");
    go("reveal");
  }
  function resumeGame(saved) {
    game = saved;
    lobby = null;
    if (game.phase === "debate") game.paused = true;
    keepAwake(); armBack();
    render(true);
    toast("Partie reprise 👍");
  }
  function quitGame() {
    stopTimer(); releaseWake(); closeAllModals();
    store.del(K.game);
    game = null;
    render(true);
  }

  // ---------- En-tête commun en jeu ----------
  function topbar(title, kicker) {
    if (kicker == null) {
      const { u, w } = counts();
      kicker = `Tour ${game.round} · ${aliveIdx().length} en jeu · ${plural(u + w, "imposteur")}`;
    }
    return h("div", { class: "topbar" },
      h("div", { class: "tb-txt" }, h("div", { class: "tb-kick" }, kicker), h("h1", { class: "tb-title" }, title)),
      h("button", { class: "iconbtn", type: "button", "aria-label": "Menu de la partie", onclick: openMenu }, "☰"));
  }
  function phases(cur) {
    const list = [["clues", "🎤 Indices"], ...(game.cfg.timer ? [["debate", "💬 Débat"]] : []), ["vote", "🗳️ Vote"]];
    const idx = cur === "elim" ? list.length : list.findIndex((x) => x[0] === cur);
    return h("div", { class: "phases" }, list.map(([, label], i) => h("span", { class: i === idx ? "on" : i < idx ? "done" : "" }, label)));
  }

  // ============================================================
  // 1) DISTRIBUTION DES MOTS
  // ============================================================
  function renderReveal() {
    const n = game.players.length;
    const seenN = game.seen.filter(Boolean).length;
    const all = seenN === n;
    const next = game.seen.indexOf(false);
    const { c, u, w } = game.comp;
    const v = h("div", null,
      topbar("Les mots", `${n} joueurs · ${c} 😇  ${u} 🕵️  ${w} 👻`),
      h("p", { class: "lead" }, all
        ? ["Tout le monde a son mot. ", h("b", null, "Que le bluff commence ! 😈")]
        : ["Passe le téléphone : chacun touche ", h("b", null, "sa propre carte"), " et la regarde en cachette 🤫"]),
      h("div", { class: `pgrid${n > 8 ? " dense" : ""}` }, game.players.map((p, i) => h("button", {
        class: `pcard${game.seen[i] ? " done" : ""}${i === next ? " next" : ""}`, type: "button",
        "aria-label": game.seen[i] ? `${p.name}, mot déjà vu` : `${p.name}, voir mon mot`,
        onclick: () => tapReveal(i),
      }, avatar(p, "lg"), h("span", { class: "nm" }, p.name), h("span", { class: "st" }, game.seen[i] ? "✓ Mot vu" : "Toucher")))));
    mount(v, h("button", { class: `btn${all ? " yellow" : ""}`, type: "button", disabled: !all, onclick: startClues },
      all ? "🎤 Lancer les indices" : `Encore ${plural(n - seenN, "joueur")}…`));
  }
  async function tapReveal(i) {
    const markSeen = () => { game.seen[i] = true; saveGame(); if (game.phase === "reveal") renderReveal(); };
    if (game.seen[i]) {
      if (await ask(`Revoir le mot de ${game.players[i].name} ?`, "Seulement si c'est bien toi et que personne ne regarde 👀", "Revoir")) openSecret(i);
    } else openSecret(i, markSeen);
  }

  function secretInfo(i) {
    const r = game.roles[i], W = game.words;
    if (r === "MRWHITE") return { cls: "mrw-bg", emoji: "👻", top: "Tu es", word: "Mr White", hint: "Tu n'as pas de mot ! Écoute bien les indices des autres et bluffe pour survivre." };
    const word = r === "UNDERCOVER" ? W.undercover : W.citizen;
    if (game.cfg.hideRoles) return { cls: "", emoji: "🤫", top: "Ton mot secret", word, hint: "Donne des indices assez clairs pour tes alliés… mais pas trop !" };
    return r === "UNDERCOVER"
      ? { cls: "und-bg", emoji: "🕵️", top: "Undercover · ton mot", word, hint: "Les autres ont un mot différent. Fonds-toi dans la masse !" }
      : { cls: "cit-bg", emoji: "😇", top: "Citizen · ton mot", word, hint: "Tu as le mot de la majorité. Démasque les imposteurs !" };
  }

  function openSecret(i, onSeen) {
    const p = game.players[i];
    let flipped = false;
    const back = h("div", { class: "face back" });
    const done = h("button", { class: "btn yellow hidden", type: "button", onclick: () => closeModal() }, "👍 C'est retenu, je cache");
    const notMe = h("button", { class: "btn ghost sm", type: "button", onclick: () => closeModal() }, `Oups, je ne suis pas ${p.name}`);
    const card = h("button", { class: "flip", type: "button", "aria-label": "Retourner la carte", onclick: () => {
      if (flipped) return;
      flipped = true;
      // Le mot n'est inséré dans la page qu'au moment où la carte se retourne
      const info = secretInfo(i);
      back.className = `face back ${info.cls}`;
      back.replaceChildren(
        h("div", { class: "bemo" }, info.emoji), h("div", { class: "btop" }, info.top),
        h("div", { class: "bword" }, info.word), h("p", { class: "bhint" }, info.hint));
      card.classList.add("on");
      card.setAttribute("aria-label", "Carte retournée");
      done.classList.remove("hidden");
      notMe.classList.add("hidden");
      play("flip"); vibrate(30);
      setTimeout(() => done.focus(), 50);
    } },
      h("div", { class: "flip-in" },
        h("div", { class: "face front" }, h("div", { class: "fq" }, "?"), h("div", { class: "ft" }, "Touche pour révéler")),
        back));
    openModal(h("div", { class: "secret" },
      h("div", { class: "s-top" }, avatar(p, "lg"), h("h2", null, p.name), h("p", null, "Personne ne regarde ? 👀")),
      card,
      h("div", { class: "secret-actions" }, done, notMe)),
      { cls: "secret-wrap", dismiss: false, onClose: () => { back.replaceChildren(); if (flipped && onSeen) onSeen(); } });
  }

  // ============================================================
  // 2) INDICES
  // ============================================================
  function makeOrder() {
    const a = shuffle(aliveIdx());
    // Mr White ne commence jamais (trop dur sans mot)
    if (game.roles[a[0]] === "MRWHITE") {
      const k = a.findIndex((i) => game.roles[i] !== "MRWHITE");
      if (k > 0) [a[0], a[k]] = [a[k], a[0]];
    }
    return a;
  }
  function startClues() {
    game.order = makeOrder();
    game.speaker = 0;
    play("start");
    go("clues");
  }
  function renderClues() {
    const O = game.order, s = game.speaker, done = s >= O.length;
    const cw = game.cfg.clueWords === 1 ? "1 seul mot" : "1 ou 2 mots";
    let spot;
    if (done) {
      spot = h("div", { class: "spot" },
        h("div", { class: "kick" }, "Tour d'indices terminé"),
        h("div", { class: "bigemo" }, "🧐"),
        h("div", { class: "who" }, "Alors, qui bluffe ?"),
        h("div", { class: "rule" }, game.cfg.timer ? "Place au débat, puis au vote." : "Débattez librement, puis votez."));
    } else {
      const p = game.players[O[s]];
      spot = h("div", { class: "spot" },
        h("div", { class: "kick" }, s === 0 ? "🎤 Premier indice" : `🎤 Indice ${s + 1} / ${O.length}`),
        avatar(p, "xl"),
        h("div", { class: "who" }, p.name),
        h("div", { class: "rule" }, `Ton indice : ${cw}`));
    }
    const v = h("div", null,
      topbar("Indices"),
      phases("clues"),
      spot,
      h("ol", { class: "order", "aria-label": "Ordre de parole" }, O.map((i, k) => h("li", { class: k < s ? "done" : k === s ? "cur" : "" },
        h("span", { class: "n" }, k + 1), avatar(game.players[i], "sm"), h("span", null, game.players[i].name)))),
      h("div", { class: "tip" }, "🚫 Interdit : dire le mot, un bout du mot ou sa traduction. Pas de phrase !"));
    let d;
    if (!done) {
      const last = s === O.length - 1;
      d = h("div", { class: "dock-row" },
        h("button", { class: "btn ghost", type: "button", disabled: s === 0, "aria-label": "Joueur précédent", onclick: () => { game.speaker--; saveGame(); renderClues(); } }, "◀"),
        h("button", { class: "btn", type: "button", onclick: () => { game.speaker++; saveGame(); play("tap"); renderClues(); } },
          last ? "C'est bon ✓" : `Au tour de ${game.players[O[s + 1]].name} ▶`));
    } else {
      d = [
        h("button", { class: "btn yellow", type: "button", onclick: game.cfg.timer ? startDebate : goVote },
          game.cfg.timer ? `💬 Débat (${fmt(game.cfg.timer)})` : "🗳️ Passer au vote"),
        h("div", { class: "two" },
          h("button", { class: "btn ghost sm", type: "button", onclick: () => { game.speaker = 0; saveGame(); play("tap"); renderClues(); } }, "🔁 Encore un tour"),
          game.cfg.timer ? h("button", { class: "btn ghost sm", type: "button", onclick: goVote }, "🗳️ Voter direct") : null),
      ];
    }
    mount(v, d);
  }

  // ============================================================
  // 3) DÉBAT (minuteur)
  // ============================================================
  let timerId = null, ring = null;
  const fmt = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` : String(s));
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function startDebate() {
    game.total = game.cfg.timer;
    game.remaining = game.cfg.timer;
    game.paused = false;
    go("debate");
  }
  function renderDebate() {
    const R = 90, C = 2 * Math.PI * R;
    const box = h("div", { class: "ring", role: "timer", "aria-label": "Temps de débat restant" });
    box.innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="${R}"/><circle class="bar" cx="100" cy="100" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`;
    const num = h("span");
    const label = h("small");
    box.append(h("div", { class: "num" }, num, label));
    const pauseBtn = h("button", { class: "btn ghost", type: "button", onclick: togglePause });
    const v = h("div", null,
      topbar("Débat"),
      phases("debate"),
      h("p", { class: "lead center" }, "Qui a un mot différent ? ", h("b", null, "Accusez, défendez-vous, bluffez ! 🔥")),
      box,
      h("div", { class: "two" }, pauseBtn, h("button", { class: "btn ghost", type: "button", onclick: addTime }, "+30 s")));
    mount(v, h("button", { class: "btn yellow", type: "button", onclick: goVote }, "🗳️ Voter maintenant"));
    ring = { box, bar: box.querySelector(".bar"), num, label, pauseBtn, C };
    updateRing();
    runTimer();
  }
  function updateRing() {
    if (!ring || !ring.box.isConnected) return;
    const r = game.remaining, t = Math.max(game.total, 1);
    ring.num.textContent = fmt(r);
    ring.label.textContent = game.paused ? "en pause" : "restant";
    ring.bar.style.strokeDashoffset = String(ring.C * (1 - r / t));
    ring.box.classList.toggle("warn", r <= 20 && r > 10);
    ring.box.classList.toggle("danger", r <= 10);
    ring.box.classList.toggle("paused", game.paused);
    ring.pauseBtn.textContent = game.paused ? "▶ Reprendre" : "⏸ Pause";
  }
  function runTimer() {
    stopTimer();
    if (!game || game.phase !== "debate" || game.paused) return;
    const endAt = Date.now() + game.remaining * 1000;
    timerId = setInterval(() => {
      const r = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
      if (r !== game.remaining) {
        game.remaining = r;
        updateRing(); saveGame();
        if (r > 0 && r <= 5) play("tick");
      }
      if (r <= 0) {
        stopTimer();
        play("buzz"); vibrate([250, 120, 250]);
        toast("⏰ Temps écoulé ! Place au vote");
        goVote();
      }
    }, 200);
  }
  function togglePause() { game.paused = !game.paused; saveGame(); play("tap"); updateRing(); runTimer(); }
  function addTime() { game.remaining += 30; game.total = Math.max(game.total, game.remaining); saveGame(); play("tap"); updateRing(); runTimer(); }

  // ============================================================
  // 4) VOTE
  // ============================================================
  function goVote() {
    ui.vote = { sel: null, tie: false, tieSel: new Set(), spinning: false };
    go("vote");
  }
  function renderVote() {
    const V = ui.vote || (ui.vote = { sel: null, tie: false, tieSel: new Set(), spinning: false });
    const A = aliveIdx();
    const v = h("div", null,
      topbar("Vote"),
      phases("vote"),
      h("p", { class: "lead" }, V.tie
        ? ["⚖️ Égalité : touche ", h("b", null, "tous les ex-aequo"), ", puis laisse le hasard trancher."]
        : ["Votez à main levée 🙋 puis touchez ", h("b", null, "le joueur éliminé"), "."]),
      h("div", { class: `pgrid${A.length > 8 ? " dense" : ""}` }, A.map((i) => {
        const on = V.tie ? V.tieSel.has(i) : V.sel === i;
        return h("button", {
          class: `pcard${on ? " sel" : ""}${V.tie ? " tie" : ""}`, type: "button", "data-i": i,
          "aria-pressed": String(on), disabled: V.spinning, onclick: () => pickVote(i),
        }, avatar(game.players[i], "lg"), h("span", { class: "nm" }, game.players[i].name));
      })));
    let d;
    if (V.tie) {
      d = [
        h("button", { class: "btn yellow", type: "button", disabled: V.tieSel.size < 2 || V.spinning, onclick: spinTie },
          V.spinning ? "🎲 Roulement…" : `🎲 Tirer au sort (${V.tieSel.size})`),
        h("button", { class: "btn ghost sm", type: "button", disabled: V.spinning, onclick: () => { V.tie = false; V.tieSel.clear(); renderVote(); } }, "Annuler l'égalité"),
      ];
    } else {
      const name = V.sel != null ? game.players[V.sel].name : null;
      d = [
        h("button", { class: "btn", type: "button", disabled: V.sel == null, onclick: () => eliminate(V.sel) }, name ? `❌ Éliminer ${name}` : "Touche un joueur"),
        h("button", { class: "btn ghost sm", type: "button", onclick: () => {
          V.tie = true; V.tieSel = new Set(V.sel != null ? [V.sel] : []); V.sel = null; play("tap"); renderVote();
        } }, "⚖️ Égalité ? Tirage au sort"),
      ];
    }
    mount(v, d);
  }
  function pickVote(i) {
    const V = ui.vote;
    if (V.spinning) return;
    if (V.tie) { if (V.tieSel.has(i)) V.tieSel.delete(i); else V.tieSel.add(i); }
    else V.sel = V.sel === i ? null : i;
    play("tap");
    renderVote();
  }
  function spinTie() {
    const V = ui.vote;
    const cands = [...V.tieSel];
    const winner = cands[Math.floor(Math.random() * cands.length)];
    const land = () => {
      V.spinning = false; V.tie = false; V.tieSel.clear(); V.sel = winner;
      play("good");
      toast(`🎲 Le sort a désigné ${game.players[winner].name}`);
      renderVote();
    };
    if (reduced()) { land(); return; }
    V.spinning = true;
    renderVote();
    const cards = new Map([...view.querySelectorAll(".pcard")].map((el) => [Number(el.dataset.i), el]));
    const steps = [];
    const start = Math.floor(Math.random() * cands.length);
    for (let k = 0; k < 12 + cands.length * 2; k++) steps.push(cands[(start + k) % cands.length]);
    steps.push(winner);
    (function step(k) {
      if (!game || game.phase !== "vote") return;
      cards.forEach((el) => el.classList.remove("spin"));
      const el = cards.get(steps[k]);
      if (el) el.classList.add("spin");
      play("tick");
      if (k === steps.length - 1) { setTimeout(land, 650); return; }
      setTimeout(() => step(k + 1), 60 + Math.pow(k / steps.length, 2) * 320);
    })(0);
  }

  // ============================================================
  // 5) ÉLIMINATION
  // ============================================================
  function evaluate() {
    const { c, u, w } = counts();
    const idx = (pred) => game.roles.map((r, i) => (pred(r, i) ? i : -1)).filter((i) => i >= 0);
    if (u + w === 0) return { type: "CITIZENS", winners: idx((r) => r === "CITIZEN") };
    if (u + w >= c) {
      return {
        type: u && w ? "IMPOSTORS" : u ? "UNDERCOVER" : "MRWHITE",
        winners: idx((r, i) => (r === "UNDERCOVER" && u > 0) || (r === "MRWHITE" && game.alive[i])),
      };
    }
    return null;
  }
  function eliminate(i) {
    if (i == null) return;
    game.alive[i] = false;
    game.log.push({ round: game.round, i, role: game.roles[i] });
    game.elim = { i, guess: null, ok: null };
    // Mr White éliminé : il tente d'abord de deviner le mot, le verdict vient après
    game.outcome = game.roles[i] === "MRWHITE" ? null : evaluate();
    ui.fresh = true;
    play("drum");
    go("elim");
  }

    const E = game.elim, i = E.i, p = game.players[i], r = game.roles[i], R = ROLES[r];

    const needGuess = r === "MRWHITE" && E.ok === null;
    const flavor = {
      CITIZEN: "Aïe… c'était un innocent ! 😬",
      UNDERCOVER: "Bien vu, un imposteur démasqué ! 🎯",
      MRWHITE: needGuess ? "Démasqué… mais il reste une dernière chance !" : E.ok ? "Et il a trouvé le mot ! 🤯" : "Pas de mot, pas de victoire ! 👻",

    const roleCard = h("div", { class: `rolecard ${R.cls}-bg` },
      h("div", { class: "re" }, R.emoji),

      h("div", { class: "rf" }, flavor));
    const after = h("div", { style: "width:100%;display:grid;gap:10px;justify-items:center" });
    if (r === "MRWHITE") after.append(guessBox());

    const v = h("div", null,

    mount(v, needGuess ? null : cont);
    if (fresh) {
      roleCard.classList.add("hidden");
      after.classList.add("hidden");
      dock.classList.add("hidden");
      setTimeout(() => {
        if (!game || game.phase !== "elim" || !roleCard.isConnected) return;
        drum.remove();
        roleCard.classList.remove("hidden");
        after.classList.remove("hidden");
        if (!needGuess) dock.classList.remove("hidden");
        play(r === "CITIZEN" ? "bad" : "good");

      }, 1500);
    }
  }
  function statusLine() {

  function loadScores() {

  function applyScores() {
    const o = game.outcome;

    S.games = (S.games || 0) + 1;
    game.points = game.players.map(() => 0);
    o.winners.forEach((i) => { game.points[i] = ROLES[game.roles[i]].pts; });
    game.players.forEach((p, i) => {
      const key = normName(p.name);
      const e = S.players[key] || (S.players[key] = { name: p.name, pts: 0, wins: 0, games: 0 });
      Object.assign(e, { name: p.name, emoji: p.emoji, hue: p.hue });
      e.games++;
      e.pts += game.points[i];
      if (game.points[i]) e.wins++;

    const cv = $("#fx"), ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = (cv.width = innerWidth * dpr), H = (cv.height = innerHeight * dpr);
    const cols = ["#ffd23f", "#ff3d81", "#2de1fc", "#8aff5e", "#ffffff", "#b18cff"];
    const P = Array.from({ length: 170 }, (_, k) => {
      const left = k % 2 === 0;
      return {
        x: left ? 0 : W, y: H * 0.72,
        vx: (left ? 1 : -1) * (4 + Math.random() * 11) * dpr,
        vy: -(10 + Math.random() * 13) * dpr,
        r: (5 + Math.random() * 6) * dpr,
        c: cols[(Math.random() * cols.length) | 0],
        a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3,
        rect: Math.random() < 0.6,
      };
    });
    const t0 = performance.now(), life = 3600, run = fxRun;
    (function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      if (run !== fxRun) return;
      ctx.globalAlpha = Math.max(0, 1 - el / life);
      for (const p of P) {
        p.vy += 0.32 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.a += p.va;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
        if (p.rect) ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        else { ctx.beginPath(); ctx.arc(0, 0, p.r / 2.6, 0, 6.29); ctx.fill(); }
        ctx.restore();
      }
      if (el < life) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    })(t0);
  }

  // ---------- Démarrage ----------
  render(true);
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
